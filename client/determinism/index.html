<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Determinism check</title>
    <!-- no favicon request, so the console stays free of 404 errors -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #141a24;
        color: #c9d3e0;
        font: 14px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
      }
      .hint {
        color: #8592a6;
        margin: 0 0 20px;
      }
      #digest {
        font: 48px/1.1 ui-monospace, Menlo, Consolas, monospace;
        color: #7f9cc0;
        letter-spacing: 0.08em;
      }
      #progress {
        margin: 8px 0 20px;
        color: #8592a6;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #243042;
      }
      th {
        color: #7f9cc0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Determinism check</h1>
      <p class="hint">Every browser must show the same digest. Compare it between Chrome, Firefox and Safari.</p>
      <div id="digest">········</div>
      <div id="progress">starting…</div>
      <table>
        <thead>
          <tr><th>case</th><th>steps</th><th>state</th><th>last hash</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
