# Music (all CC0, sources and authors in tools/audio-build/manifest.ts and assets/LICENSES.md).
tracks:
  - { id: menu-fantasy-theme, file: audio/music/menu-fantasy-theme.ogg }
  - { id: run-determined-pursuit, file: audio/music/run-determined-pursuit.ogg }
  - { id: boss-fight, file: audio/music/boss-fight.ogg }
  - { id: final-epic-endgame, file: audio/music/final-epic-endgame.ogg }
  - { id: victory-fanfare, file: audio/music/victory-fanfare.ogg, loop: false }
  - { id: defeat-game-over, file: audio/music/defeat-game-over.ogg, loop: false }

music:
  menu: menu-fantasy-theme
  run: [run-determined-pursuit]
  miniboss: boss-fight
  final: final-epic-endgame
  victory: victory-fanfare
  defeat: defeat-game-over

