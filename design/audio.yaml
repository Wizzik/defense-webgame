# Sounds and music of the game. `npm run audio:build` checks this file against the game data
# and writes data/generated/audio.json. A cue is a named sound: `files` are recorded variants
# (paths under assets/), `synth` is the fallback tone of client/audio/sfx.ts when no file loads.
# Defaults: gainDb 0, pitchSpread 0.06, gainSpreadDb 2, maxVoices 4, priority 1 (0-3), category sfx.
# Hero families (spec 5.1): stone (Stonehorn), moon (Nightglaive), bone/grave (Gravecaller),
# storm/shaman (Serpent Shaman), mist (Mistwarden), spark (Sparkshot), blood/cleaver (Redcleaver),
# tide (Tidecaller); shared-* for the shared spells.

cues:
  - id: stone-strike
    files: []
    synth: hit
    gainDb: -4
