# MVP heroes. The names are working names and may change.
# source: hero code in the map export (heroes.json).
# mapName: the hero's name in the map, kept here only to look the hero up.
#   data-build never writes it to data/generated.
# signatureAbilities (in order) and ultimate are ability ids from design/abilities.yaml.
# damageTaken: optional multiplier on the damage enemies deal to the hero (missing = 1).
# power: optional balance multiplier on all the hero's damage and heals, base attack and spell power (missing = 1;
#   Petr's batch 2, task 7: about 10 % autopilot wins with no gear for every hero).
# attack: optional design changes of the base attack (2026-11-26, Petr): rangeScale and cooldownScale multiply the
#   map's range and cooldown (before design/scaling.yaml), strikes = blows per attack, splash = { radius, share }.

- id: stonehorn
  source: O00C
  mapName: Tauren
  name: { en: Stonehorn, cs: Kamenorohý }
  role: { en: "Melee bruiser. Stuns with stone and quakes.", cs: "Rváč na blízko. Omračuje kamenem a otřesy." }
  signatureAbilities: [rock-rupture, enhanced-totem, seismic-echo]
  ultimate: groundbreaker
  damageTaken: 0.35   # melee: stands in the crowd
  power: 2.0   # balance (batch 2, task 7)

- id: nightglaive
  source: O008
  mapName: Daisho
  name: { en: Nightglaive, cs: Noční čepel }
  role: { en: "Ranged hunter. Swift strikes and falling stars.", cs: "Lovkyně na dálku. Rychlé útoky a padající hvězdy." }
  signatureAbilities: [falling-stars, hunters-focus, swift-pace]
  ultimate: shadow-sisters
  attack: { rangeScale: 2 }   # Petr: ranged heroes reach twice as far
  power: 1.7   # balance (batch 2, task 7)
  damageTaken: 0.5

- id: gravecaller
