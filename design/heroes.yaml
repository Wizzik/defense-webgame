  signatureAbilities: [grave-grasp, skull-ring, soul-bolt]
  ultimate: bone-stampede
  attack: { rangeScale: 2 }   # Petr: ranged heroes reach twice as far
  power: 0.45   # balance (batch 2, task 7)

- id: serpent-shaman
  source: O00X
  mapName: Snaker
  name: { en: Serpent Shaman, cs: Hadí šaman }
