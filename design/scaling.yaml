# Uniform multipliers from the map's numbers to the survivors pace (spec 5).
# data-build applies them to every hero, ability and enemy, so the map's ratios stay.
heroes: { moveSpeed: 1.4, attackCooldown: 0.5 }
abilities: { cooldown: 0.33, damage: 0.3, levelGrowthExponent: 0.5, levels: 10 }   # damage: direct, tick and heal amounts of every ability; empower is untouched
# levelGrowthExponent (Petr 2026-11-19, path A; spec 2026-11-19 4.1): after the damage multiplier every damage and heal row
# grows from level 1 as value[L] = value[1] * (value[L] / value[1]) ^ e; level 1 does not change (0.5 = square root).
# levels (Petr 2026-11-26): every ability with more than 2 levels (all but the ultimates) is spread over this many
# levels last: level 1 and the top level keep the map's (scaled) values, the levels between interpolate them.
enemies: { hp: 0.35, moveSpeed: 1.32 }   # phase 2b-2: tougher and faster packs (hp 0.3 -> 0.35, moveSpeed 1.22 -> 1.32)
