# The world ladder (spec 2026-11-21 difficulties and worlds 4.1). The order is the world's number, 1-5; winning
# world N on a difficulty unlocks world N + 1 on it (meta/progress.ts). Names and blurbs are our own.
# color: the dark card colour in the world screen (no orange). ready: false = playable with the look of world 1 and
# marked "coming soon" until the worlds plan 3 gives it its own look.
# hazard kinds: storm (bolts after a warning circle), weather (a timed event slowing everyone's walking: effect sand),
# thicket (fixed zones [x, y, r] of brake slowing walking inside them; a path wins over a zone).
- id: silver-march
  name: { en: Silver March, cs: Stříbrná marka }
  blurb:
    en: "Green fields at dusk, old farms and the first walls of the realm."
    cs: "Zelené pláně za soumraku, staré statky a první hradby říše."
  color: "#1e3b40"
  ready: true
  # The fixed skeleton of world 1 (spec 4.5; north is +y): the old wall with two gates 250 wide at x = -625 and 625,
  # its ends about 1960 from the castle (inside the arrival ring), four paths (+15 % speed). Worlds 2-5 share it until
  # the worlds plan 3.
  map: &silverMap
    paths:
      width: 160
      speedBonus: 0.15
      lines:
        - [[0, 200], [-625, 1300], [-625, 1700], [-1100, 2800]]
        - [[0, 200], [625, 1300], [625, 1700], [1100, 2800]]
        - [[0, -200], [0, -2850]]
        - [[-200, 0], [-2850, -300]]
    feature:
      thickness: 90
      segments:
        - [-1650, 1050, -1400, 1500]
        - [-1400, 1500, -750, 1500]
        - [-500, 1500, 500, 1500]
        - [750, 1500, 1400, 1500]
        - [1400, 1500, 1650, 1050]
    islands:
      count: { min: 30, max: 40 }
      radius: { min: 40, max: 220 }
      gap: 120
      kinds: { rock: 5, trees: 4, ruin: 2 }
    clear: { castle: 600, ringInner: 2200, ringOuter: 2600, pathMargin: 60, featureMargin: 150 }
  # Bolts in waves from phase 3: a blue-white warning circle 1.2 s before each strike (spec 4.7).
  hazard: &silverStorm
    kind: storm
    fromPhase: 3
    everySeconds: { min: 55, max: 70 }
    bolts: { min: 1, max: 3 }
    spread: 300
    warnSeconds: 1.2
    radius: 120
    heroShare: 0.08
    enemyShare: 0.2
    bossShare: 0.02
    name: { en: Summer storm, cs: Letní bouře }
- id: red-waste
  name: { en: Red Waste, cs: Rudá pustina }
  blurb:
    en: "Red clay and dry grass where the clans gather under a hard sky."
    cs: "Rudá hlína a suchá tráva, kde se pod tvrdým nebem shromažďují klany."
  color: "#3d2427"
  ready: false
  # A river across the arena (thickness 150) with two bridges, gaps 400 at x = -1100..-700 and 950..1350 (spec 4.5).
  map:
    paths:
      width: 160
      speedBonus: 0.15
      lines:
        - [[0, 200], [-900, 1205], [-1200, 2800]]
        - [[0, 200], [1150, 1100], [1500, 2800]]
        - [[0, -200], [0, -2850]]
        - [[200, 0], [2850, -300]]
    feature:
      thickness: 150
      segments:
        - [-3000, 1500, -1500, 1150]
        - [-1500, 1150, -1100, 1186]
        - [-700, 1223, -400, 1250]
        - [-400, 1250, 600, 1000]
        - [600, 1000, 950, 1064]
        - [1350, 1136, 1700, 1200]
        - [1700, 1200, 3000, 900]
    islands:
      count: { min: 28, max: 36 }
      radius: { min: 40, max: 200 }
      gap: 120
      kinds: { rock: 6, trees: 1, ruin: 3 }
    clear: { castle: 600, ringInner: 2200, ringOuter: 2600, pathMargin: 60, featureMargin: 150 }
  # A sandstorm from phase 2: announced 5 s ahead, then 15 s of -20 % walking speed for everyone.
  hazard:
    kind: weather
    effect: sand
    fromPhase: 2
    everySeconds: { min: 100, max: 130 }
    durationSeconds: 15
    warnSeconds: 5
    moveSlow: 0.2
    name: { en: Sandstorm, cs: Písečná bouře }
- id: shadewood
  name: { en: Shadewood, cs: Stínový hvozd }
  blurb:
    en: "An endless night under ancient trees, lit only by the moon."
    cs: "Nekonečná noc pod pradávnými stromy, osvětlená jen měsícem."
  color: "#1a2440"
  ready: false
  # A ring of ancient trees 1300 around the castle (thickness 110) with four passages 400 wide on the diagonals.
  map:
    paths:
      width: 160
      speedBonus: 0.15
      lines:
        - [[150, 150], [2000, 2000]]
        - [[-150, 150], [-2000, 2000]]
        - [[-150, -150], [-2000, -2000]]
        - [[150, -150], [2000, -2000]]
    feature:
      thickness: 110
      segments:
        - [767, 1050, 427, 1228]
        - [427, 1228, 0, 1300]
        - [0, 1300, -427, 1228]
        - [-427, 1228, -767, 1050]
        - [-1050, 767, -1228, 427]
        - [-1228, 427, -1300, 0]
        - [-1300, 0, -1228, -427]
        - [-1228, -427, -1050, -767]
        - [-767, -1050, -427, -1228]
        - [-427, -1228, 0, -1300]
        - [0, -1300, 427, -1228]
        - [427, -1228, 767, -1050]
        - [1050, -767, 1228, -427]
        - [1228, -427, 1300, 0]
        - [1300, 0, 1228, 427]
        - [1228, 427, 1050, 767]
    islands:
      count: { min: 34, max: 44 }
      radius: { min: 40, max: 200 }
      gap: 120
      kinds: { rock: 2, trees: 7, ruin: 1 }
    clear: { castle: 600, ringInner: 2200, ringOuter: 2600, pathMargin: 60, featureMargin: 150 }
  # Thornbrake: walking inside a zone is 35 % slower (a path through a zone is not).
  hazard:
    kind: thicket
    slow: 0.35
    zones:
      - [1850, 0, 300]
      - [650, 1785, 280]
      - [-1691, 616, 320]
      - [-1832, -667, 260]
      - [0, -1850, 300]
      - [1645, -950, 280]
      - [0, 900, 200]
      - [-325, -893, 200]
    name: { en: Thornbrake, cs: Trnité houští }
- id: frostreach
  name: { en: Frostreach, cs: Mrazivý sever }
  blurb:
    en: "Snow, ice and a cold grey light at the edge of the world."
    cs: "Sníh, led a studené šedé světlo na okraji světa."
  color: "#2a3a4c"
  ready: false
  map: *silverMap
  hazard: *silverStorm
- id: blightscar
  name: { en: Blightscar, cs: Spálená říše }
  blurb:
    en: "Scorched black earth under a violet sky and green flame."
    cs: "Spálená černá země pod fialovou oblohou a zeleným ohněm."
  color: "#2a1c34"
  ready: false
  map: *silverMap
