# The world ladder (spec 2026-11-21 difficulties and worlds 4.1). The order is the world's number, 1-5; winning
# world N on a difficulty unlocks world N + 1 on it (meta/progress.ts). Names and blurbs are our own.
# color: the dark card colour in the world screen (no orange). ready: false = playable with the look of world 1 and
# marked "coming soon" (every world has its own look since plan 3b). strength: enemy hp and damage x this on top of
# rules.difficulty.worldStep (default 1), to tune one world of the ladder.
# hazard kinds: storm (bolts after a warning circle), weather (a timed event slowing everyone's walking: effect sand),
# thicket (fixed zones [x, y, r] of brake slowing walking inside them; a path wins over a zone); weather effect snow may
# carry chill (a hero standing stillSeconds in it attacks slower by attackSlow); meteors (waves like the storm, `bolts`
# meteors per hero, each leaving a pool of fire that burns heroes and enemies inside by a share of max hp a second).
# bosses (Petr's batch 2): how the world shows each boss of the run (keyed by the boss's type, which keeps its
# mechanics: the boss slot); name in EN and CS, model (a common enemy type whose model it borrows), body tint, size (a
# scale of the drawn model only) and the colour of the ring under it. World 1 has none: it keeps today's bosses.
- id: silver-march
  name: { en: Silver March, cs: Stříbrná marka }
  blurb:
    en: "Green fields at dusk, old farms and the first walls of the realm."
    cs: "Zelené pláně za soumraku, staré statky a první hradby říše."
  color: "#1e3b40"
  ready: true
  # The fixed skeleton of world 1 (spec 4.5; north is +y): the old wall with two gates 250 wide at x = -625 and 625,
  # its ends about 1960 from the castle (inside the arrival ring), four paths (+15 % speed). Worlds 2-5 share it until
  # the worlds plan 3.
  map:
    paths:
      width: 160
      speedBonus: 0.15
      lines:
        - [[0, 200], [-625, 1300], [-625, 1700], [-1100, 2800]]
        - [[0, 200], [625, 1300], [625, 1700], [1100, 2800]]
        - [[0, -200], [0, -2850]]
        - [[-200, 0], [-2850, -300]]
    feature:
      thickness: 90
      segments:
        - [-1650, 1050, -1400, 1500]
        - [-1400, 1500, -750, 1500]
        - [-500, 1500, 500, 1500]
        - [750, 1500, 1400, 1500]
        - [1400, 1500, 1650, 1050]
    islands:
      count: { min: 30, max: 40 }
      radius: { min: 40, max: 220 }
      gap: 120
      kinds: { rock: 5, trees: 4, ruin: 2 }
    clear: { castle: 600, ringInner: 2200, ringOuter: 2600, pathMargin: 60, featureMargin: 150 }
  # Bolts in waves from phase 3: a blue-white warning circle 1.2 s before each strike (spec 4.7).
  hazard:
    kind: storm
    fromPhase: 3
    everySeconds: { min: 55, max: 70 }
    bolts: { min: 1, max: 3 }
    spread: 300
    warnSeconds: 1.2
    radius: 120
    heroShare: 0.08
    enemyShare: 0.2
    bossShare: 0.02
    name: { en: Summer storm, cs: Letní bouře }
