# Run rules: a run of 20 phases (16:40) that ends with the final boss (phase 2b-3). Defaults, tuned by playing.
# Comments may name the origin in the map; they never reach data/generated/rules.json.
# The map's castle (hcas) has 155 000 HP and regenerates 200 HP/s; ours has 58 000 for the 16:40 run (14 000 held 5 minutes).
# The map sends 7 units per gate per 30 s on Normal; the game sends packs (below).
# Tuned with `npm run sim:run -- --hero all --seeds 1-20` and the same with `--idle` (phases, castle hp, xpStep, finale);
# the targets and the results are in docs/DECISIONS.md.
start: { hero: stonehorn }
run:
  durationSeconds: 1000   # the final boss comes at this time; the run is won when it falls
  phaseSeconds: 50
  firstPackSeconds: 2
  # enemy HP and damage x min(cap, 1 + t / seconds), spec 3.2; cap 1 since 2026-11-26: enemies grow with the hero's
  # level instead (enemies.levelScaling), which gives about the same numbers on average
  timeScaling: { seconds: 1200, cap: 1 }
  rushWarningSeconds: 7   # the map warns 7 s ahead too
  # packScale: pack sizes of the last phase while the finale lasts. The enrage counts from the boss's arrival.
  finale: { boss: dread-regent, packScale: 0.35, enrageAfterSeconds: 200, enrage: { damage: 2, moveSpeed: 1.3, slamCooldown: 0.5 } }
arena:   # the castle stands in the middle; packs come from random directions on the spawn ring
  width: 6000
  height: 6000
  castle: { x: 0, y: 0 }
  heroStart: { x: 0, y: 500 }
  spawn: { radius: 2400, spread: 150 }
castle: { hp: 58000, radius: 180, regenPercentPerMinute: 1 }
hero: { collision: 32, baseRegen: 0.25, regenPerStr: 0.05, spellPowerPerInt: 0.005,   # spec 2026-11-19 4.2: was 0.01
        cooldownSpeedPerInt: 0.01,
        dash: { distance: 350, seconds: 0.15, cooldownSeconds: 4, charges: { fromLevel: 10, count: 3 } },
        # Petr 2026-11-26: 3 dash charges from level 20; the blink (F) from level 40: jump to the mouse, a stunning burst
        # Petr's batch 3 (fewer hero levels): 3 dash charges from level 10, the blink from level 20
        # Petr 2026-11-27 (batch 2): the blink is an instant teleport to the mouse at any distance (kept in the arena,
        # off the obstacles); aheadDistance is only the jump straight ahead when there is no mouse point
        blink: { fromLevel: 20, cooldownSeconds: 10, aheadDistance: 900, radius: 300, damage: 300, stunSeconds: 0.5 } }
autocast: { novaMinEnemies: 1, healBelow: 0.6, shieldBelow: 0.35 }
# Petr 2026-11-26: heroDefendRange: while the hero is within it of the castle every enemy goes for him (a solo hero
# fighting on one side no longer loses the castle to the other); levelScaling: new enemies grow with the hero level
# (hp and damage +0.9 % a level) in place of the time scaling: a hero ends a run near level 95, so the end is about
# x1.85 as before, but a hero who levels faster meets stronger enemies.
enemies: { maxAlive: 600, siegerAggroRange: 250, leashRange: 900, heroDefendRange: 1000, levelScaling: { hp: 0.009, damage: 0.009 }, knockback: { attack: 40, ability: 90, seconds: 0.15 }, bossStunScale: 0.25 }
# A phase sends `packs` packs every interval, each from its own side: `mix` weights the enemy types, `pack` is
# the size and the interval, `hunterShare` the chance that a pack hunts the hero, `elites` the elites
# (the elite of the phase's faction) that come with the first pack of the phase.
# Phases 6-20 (enemy factions, 2026-11-20): each faction's foot, shooter, heavy and caster keep the weights of the
# human roles in the same phase (foot = shieldbearer + scout), so only the types change, not the pressure by role.
# Casters (Petr's batch 2, 2026-11-27): from phase 3 each faction's caster (battle-mage, fire-caller, bone-acolyte,
# moon-priestess) is at least a quarter of the mix weight; its weight came mostly out of the foot types.
phases:
  - { mix: { shieldbearer: 8, scout: 3 }, pack: { min: 6, max: 10, everySeconds: 6 }, packs: 2, hunterShare: 0.25, elites: 0 }   # 1
  - { mix: { shieldbearer: 6, scout: 3, musketeer: 2 }, pack: { min: 8, max: 11, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 0 }   # 2
  - { mix: { shieldbearer: 3, scout: 2, musketeer: 2, chaplain: 1, lancer: 1, battle-mage: 3 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 1 }   # 3
  - { mix: { shieldbearer: 2, scout: 2, musketeer: 3, chaplain: 2, lancer: 2, battle-mage: 4 }, pack: { min: 9, max: 13, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 1 }   # 4
  - { mix: { shieldbearer: 2, scout: 1, musketeer: 3, chaplain: 2, lancer: 3, battle-mage: 4 }, pack: { min: 7, max: 10, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 5
  - { mix: { brute: 4, spearthrower: 3, hornback: 3, bloodcaller: 2, fire-caller: 4 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 6
  - { mix: { brute: 4, spearthrower: 3, hornback: 3, bloodcaller: 2, fire-caller: 4 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 7
  - { mix: { brute: 4, spearthrower: 3, hornback: 3, bloodcaller: 2, fire-caller: 4 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 8
  - { mix: { brute: 3, spearthrower: 3, hornback: 3, bloodcaller: 2, fire-caller: 4 }, pack: { min: 9, max: 13, everySeconds: 5 }, packs: 4, hunterShare: 0.35, elites: 2 }   # 9
  - { mix: { brute: 3, spearthrower: 3, hornback: 3, bloodcaller: 2, fire-caller: 4 }, pack: { min: 9, max: 13, everySeconds: 5 }, packs: 4, hunterShare: 0.35, elites: 2 }   # 10
  - { mix: { ghoul: 3, webcrawler: 3, rotgut: 3, gravebinder: 2, bone-acolyte: 4 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 11
  - { mix: { ghoul: 3, webcrawler: 3, rotgut: 3, gravebinder: 2, bone-acolyte: 4 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 12
  - { mix: { ghoul: 3, webcrawler: 3, rotgut: 3, gravebinder: 2, bone-acolyte: 4 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 13
  - { mix: { ghoul: 3, webcrawler: 4, rotgut: 3, gravebinder: 2, bone-acolyte: 4 }, pack: { min: 10, max: 14, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 14
  - { mix: { ghoul: 3, webcrawler: 4, rotgut: 3, gravebinder: 2, bone-acolyte: 4 }, pack: { min: 10, max: 14, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 15
  - { mix: { huntress: 4, moon-archer: 4, stone-warden: 4, grove-druid: 2, moon-priestess: 5 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 16
  - { mix: { huntress: 4, moon-archer: 4, stone-warden: 4, grove-druid: 2, moon-priestess: 5 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 17
  - { mix: { huntress: 4, moon-archer: 4, stone-warden: 4, grove-druid: 2, moon-priestess: 5 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 18
  - { mix: { huntress: 3, moon-archer: 4, stone-warden: 4, grove-druid: 2, moon-priestess: 5 }, pack: { min: 12, max: 16, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 3 }   # 19
  - { mix: { huntress: 3, moon-archer: 4, stone-warden: 4, grove-druid: 2, moon-priestess: 5 }, pack: { min: 12, max: 16, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 3 }   # 20
# Enemy factions by phase (spec 2026-11-20): `elite` comes as the elite of their phases and leads their rushes,
# `heavy` follows it in a rush.
factions:
  - { id: human, name: { en: Human Legion, cs: Lidská legie }, fromPhase: 1, elite: captain, heavy: lancer }
  - { id: orc, name: { en: Blood Clan, cs: Krvavý klan }, fromPhase: 6, elite: warlord, heavy: hornback }
  - { id: undead, name: { en: Restless Dead, cs: Neklidní mrtví }, fromPhase: 11, elite: bone-tyrant, heavy: rotgut }
  - { id: elf, name: { en: Moon Grove, cs: Měsíční háj }, fromPhase: 16, elite: grove-warden, heavy: stone-warden }
# Timed events, ascending by time. A rush is one pack of siegers from one side, announced rushWarningSeconds ahead:
# `elites` elites and then `heavies` heavy types of the faction of the phase the rush comes in; a boss comes alone.
events:
  - { atSeconds: 180, kind: rush, elites: 2, heavies: 3 }
  - { atSeconds: 250, kind: boss, enemy: iron-marshal }
  - { atSeconds: 360, kind: rush, elites: 4, heavies: 6 }
  - { atSeconds: 500, kind: boss, enemy: pale-abbot }
  - { atSeconds: 540, kind: rush, elites: 5, heavies: 8 }
  - { atSeconds: 720, kind: rush, elites: 6, heavies: 10 }
  - { atSeconds: 750, kind: boss, enemy: gunmaster }
  - { atSeconds: 900, kind: rush, elites: 8, heavies: 12 }
# XP a hero has at the start of each phase, for ?phase=N. Filled from `npm run sim:run -- --phase-xp`.
debug: { phaseXp: [0, 191, 476, 875, 1558, 2595, 4016, 5428, 6873, 8637, 10647, 12981, 15405, 17707, 20773, 24046, 27680, 31287, 34767, 38715] }
# threat: multiplies all damage enemies deal to the hero (sim/combat.ts damageHero: hits, shots, charges, boss
#   strikes, slams), times the hero's own damageTaken (heroes.yaml). The castle takes damage as before.
threat: { heroDamageTaken: 2 }
# sustain (spec 2026-11-19 sustain, sim/buffs.ts, sim/orbs.ts): lifesteal from gear heals at most capPerSecond x max hp
#   a second; a common enemy drops a heart with hearts.chance (elites and bosses always), a heart heals healShare x
#   max hp. Up to orbs.maxOnMap orbs lie between min and maxCastleDistance from the castle, minSpacing apart and
#   chestSpacing from chests; place i first spawns at firstSeconds[i], then respawnSeconds after a pickup. An orb lasts
#   buffSeconds: boots x moveSpeed, berserk x damage on everything the hero deals, heal share x max hp over the time.
sustain:
  buffSeconds: 15
  lifesteal: { capPerSecond: 0.02 }
  hearts: { chance: 0.04, healShare: 0.08 }
  orbs: { maxOnMap: 3, firstSeconds: [8, 20, 32], respawnSeconds: { min: 30, max: 45 }, minCastleDistance: 300,
    maxCastleDistance: 2000, minSpacing: 500, chestSpacing: 200, pickupRadius: 70 }
  boots: { moveSpeed: 2 }
  berserk: { damage: 1.5 }
  heal: { share: 1 }
# Gear (items, chests, boss drops). Tuned in docs/DECISIONS.md, section Gear, drops and chests.
# gear: an item's numbers with permanent level B and chest levels T are its level-1 numbers
#   x (1 + levelStep x max(B - 1, 0) + chestLevelStep x T); an item a chest gave has B = 0, so its first chest level
#   counts too. A duplicate from a boss raises the permanent level up to maxPermanentLevel, chests add levels without
#   a cap. chestLevelStep is tuned with `npm run sim:chests` (docs/DECISIONS.md, section Chest loot).
gear: { levelStep: 0.15, chestLevelStep: 0.25, maxPermanentLevel: 5 }
# chests: `count` chests lie between min and maxCastleDistance from the castle and minSpacing apart. The n-th chest
#   opened costs basePrice x priceGrowth^(n - 1) gold and offers slotsPerOffer cards. Each card rolls a rarity by
#   rarityWeights (raised by the hero's magic find), then a slot not yet in the offer; a slot that wears that rarity
#   or a higher one gets a Level card of its item (loot.upgradeShare) or the card moves to a slot where the rarity is
#   an upgrade (sim/chests.ts). An empty slot takes the item at chest level 1, a taken higher rarity replaces the worn
#   item with the slot's whole level + 1, a Level card or a kept one adds a level to the worn item.
chests: { count: 3, basePrice: 100, priceGrowth: 1.12, minCastleDistance: 700, maxCastleDistance: 2000, minSpacing: 600, pickupRadius: 80, slotsPerOffer: 3,
  rarityWeights: { common: 25, rare: 30, epic: 37, legendary: 6, mythic: 2 } }
# magicFind: the hero's magic find MF (sum over worn items, 0.12 = 12 %) has diminishing returns:
#   effective = MF x limit / (MF + limit) (50 % -> 37.5 %, 100 % -> 60 %, 300 % -> 100 %). Every rarity above the
#   lowest one of a weight table (chests, boss drops) gets its weight x (1 + effective x rarityFactor); the lowest
#   keeps its weight (sim/magic-find.ts).
magicFind: { limit: 1.5, rarityFactor: { rare: 1, epic: 1.5, legendary: 2, mythic: 2.5 } }
# drops: every boss drops one item; its rarity is drawn by these weights (meta/drop.ts).
drops:
  - { boss: iron-marshal, weights: { common: 60, rare: 40 } }
  - { boss: pale-abbot, weights: { rare: 60, epic: 40 } }
  - { boss: gunmaster, weights: { epic: 75, legendary: 25 } }
  - { boss: dread-regent, weights: { epic: 50, legendary: 40, mythic: 10 } }
# loot: random items (spec 2026-11-26 random items, docs/DECISIONS.md section Random items; bases in
#   design/item-bases.yaml, affixes in design/affixes.yaml). A rolled item has its base's implicit row
#   (implicitPoints) and affixCount affix rows; the affix rows share the rest of the rarity's budget (design/items.yaml
#   header): row i = (budget - implicitPoints) x weight_i / (sum of the weights) x a roll in [1 - rowRoll, 1 + rowRoll]
#   points, weight_i the weight of its tier (T1-T4 in `tiers`); a tier rolls only when the item power reaches its
#   minPower, so a strong source gives fewer and bigger rows, never more points. smartShare of the affixes (and the
#   base's flavour) come from the hero's primary attribute's pool. A card or drop of a rarity is a named item
#   (design/items.yaml) with namedShare, else a rolled one; a mythic roll draws one of mythicEffects.
#   Item power: power.boss[boss order] for a drop, chestBase + chestPerPhase x phase for a chest, + perWorld x
#   (world - 1) + power.difficulty; a dropped item has the highest level whose levelAtPower the power reaches.
#   upgradeShare (Petr's batch 2): a chest card never offers a rarity at or below what its slot wears; a card drawn
#   for such a slot is a Level card of the worn item with this share, else it moves to a slot where it is an upgrade.
#   salvageGold: gold a salvaged item gives the next run's chests; the collection holds collectionLimit items.
#   bankLimit: the most salvage gold the bank keeps; the next solo run starts with all of it (meta/salvage.ts).
#   critDamage: the extra damage of a critical basic attack before gear; caps: the most gear gives of crit chance,
#   crit damage (stage 5: a rolled mythic set stacked +3.6 crit damage, x5 attack), dodge and damage taken (sim/hero.ts).
loot:
  smartShare: 0.6
  collectionLimit: 200
  # mythic 42 -> 34 (random items stage 5): a rolled mythic set (sim:run --gear rolled-full) came out about 30 % above
  # the named full preset in the main attribute; with 34 it wins as often (world 3 hell, seeds 1-10: 13 of 80 both). Named mythics keep 42
  # (design/items.yaml): their rows do not all lean to one attribute.
  budget: { common: 6, rare: 12, epic: 20, legendary: 30, mythic: 34 }
  implicitPoints: 2
  rowRoll: 0.08
  affixCount: { common: 1, rare: 2, epic: 3, legendary: 4, mythic: 4 }
  namedShare: { common: 0, rare: 0, epic: 0.1, legendary: 0.25, mythic: 0.4 }
  upgradeShare: 0.5
  salvageGold: { common: 10, rare: 25, epic: 50, legendary: 90, mythic: 150 }
  bankLimit: 500
  tiers: [{ weight: 1, minPower: 0 }, { weight: 1.35, minPower: 3 }, { weight: 1.7, minPower: 6 }, { weight: 2, minPower: 9 }]
  power: { boss: [2, 4, 6, 8], chestBase: 1, chestPerPhase: 0.3, perWorld: 0.5, difficulty: { normal: 0, insane: 1, hell: 2 } }
  levelAtPower: [0, 3, 6, 9, 12]
  critDamage: 0.5
  caps: { critChance: 0.6, critDamage: 1.5, dodge: 0.4, damageTaken: 0.5 }
  mythicEffects:
    - kind: chain_on_attack
      params: { every: 4, damage: 120, jumps: 4, range: 380 }
      text:
        en: "Every 4th attack throws lightning that jumps on to 4 enemies."
        cs: "Každý 4. útok vyšle blesk, který přeskočí na 4 nepřátele."
    - kind: splash_on_attack
      params: { chance: 0.3, radius: 220, fraction: 0.6 }
      text:
        en: "Attacks have a 30 % chance to hit everyone around the target for 60 % of the damage."
        cs: "Útok má 30% šanci zasáhnout všechny kolem cíle za 60 % poškození."
    - kind: low_hp_shield
      params: { threshold: 0.3, seconds: 3, cooldown: 40 }
      text:
        en: "Under 30 % HP you and the castle take no damage for 3 s. Works once in 43 s."
        cs: "Pod 30 % HP nedostáváš ty ani hrad 3 s žádné poškození. Funguje jednou za 43 s."
    - kind: haste_on_elite_kill
      params: { cooldownSpeed: 1.5, seconds: 8 }
      text:
        en: "When an elite or a boss falls, your spells recharge 50 % faster for 8 s."
        cs: "Když padne elita nebo boss, kouzla se ti 8 s dobíjejí o 50 % rychleji."
    - kind: slow_aura
      params: { radius: 350, slow: 0.25 }
      text:
        en: "Enemies near you walk 25 % slower."
        cs: "Nepřátelé poblíž tebe chodí o 25 % pomaleji."
    - kind: gold_heals_castle
      params: { perGold: 1.5 }
      text:
        en: "Every gold you collect heals the castle by 1.5 HP."
        cs: "Každý sebraný zlaťák vyléčí hrad o 1,5 HP."
    - kind: heal_on_kill
      params: { kills: 10, hp: 60 }
      text:
        en: "Every 10th kill heals you by 60 HP."
        cs: "Každé 10. zabití tě vyléčí o 60 HP."
    - kind: nova_when_hit
      params: { cooldown: 3, damage: 200, radius: 300 }
      text:
        en: "When you are hit, a blast hurts every enemy around you. Works once in 3 s."
        cs: "Když tě něco zasáhne, výbuch zraní všechny nepřátele kolem tebe. Funguje jednou za 3 s."
    - kind: elite_slayer
      params: { share: 0.3 }
      text:
        en: "You deal 30 % more damage to elites and bosses."
        cs: "Elitám a bossům dáváš o 30 % větší poškození."
    - kind: death_burst
      params: { chance: 0.25, damage: 70, radius: 200 }
      text:
        en: "Enemies you kill have a 25 % chance to burst and hurt the enemies around them."
        cs: "Nepřítel, kterého zabiješ, má 25% šanci vybuchnout a zranit nepřátele kolem sebe."
    - kind: castle_ward
      params: { share: 0.3 }
      text:
        en: "The castle takes 30 % less damage."
        cs: "Hrad dostává o 30 % menší poškození."
# xpQuad 0.3 (Petr's batch 3, 2026-11-27): XP to leave level L is xpFirst + xpStep (L - 1) + xpQuad (L - 1)^2, so
# the first levels come as fast as before and a won run ends near level 65 instead of 102 ("chtěli bychom tak level
# 60-70"; a plain xpStep 22 slowed the first minute too and the heroes fell); co-op uses the same curve, each kill's
# XP x 1 / (1 + coop.perPlayer.packSize x (n - 1)) (sim/difficulty.ts).
progression: { xpFirst: 10, xpStep: 9, xpQuad: 0.3, magnetRadius: 300, crystalSpeed: 900, pickupRadius: 56, attributeCardAmount: 10, cardsPerOffer: 3,
  ultimateFromLevel: 6, ultimateLevelStep: 6,   # map: ultimates need hero level 10
  # Shared spells and passives (docs/DECISIONS.md, section Shared spells and passives): the pools, the
  # number of slots, and the weights of the four card groups (a group is drawn by weight, then a card in it).
  sharedSpells: [arc-lightning, smite, fire-bolt, frost-ring, meteor, holy-ground, blade-fan, shock-wave, sentry-ward, second-wind],
  passives: [might, arcane-focus, haste, vigor, fleet-foot, fortune],
  sharedSpellSlots: 2, passiveSlots: 4,
  cardWeights: { signature: 4, sharedUpgrade: 3, newSpell: 2, newPassive: 2 } }
# difficulty (spec 2026-11-21 difficulties and worlds 4.2, sim/difficulty.ts, docs/DECISIONS.md section Difficulties
#   and worlds): enemy hp and damage x level.hp / level.damage x (1 + worldStep x (world - 1)); pack sizes x packSize
#   (the cap of enemies.maxAlive stays); elites and bosses get eliteHp on top; extraRushes come on top of `events`
#   (elites and heavies of the phase's faction, announced like the others). Rewards: gold from enemies
#   x (1 + goldPerWorld x (world - 1)), magic find + magicFindPerWorld x (world - 1) + level.magicFind.
#   World 1 on normal is the game as it was before the worlds.
difficulty:
  worldStep: { hp: 0.035, damage: 0.035 }
  reward: { goldPerWorld: 0.1, magicFindPerWorld: 0.1 }
  levels:
    normal: { hp: 1, damage: 1, packSize: 2, eliteHp: 1, magicFind: 0, extraRushes: [] }
    insane: { hp: 1.35, damage: 1.35, packSize: 2.4, eliteHp: 1, magicFind: 0.25, extraRushes: &extraRushes [
      { atSeconds: 90, elites: 1, heavies: 2 },
      { atSeconds: 270, elites: 2, heavies: 3 },
      { atSeconds: 450, elites: 3, heavies: 4 },
      { atSeconds: 630, elites: 4, heavies: 6 },
      { atSeconds: 810, elites: 5, heavies: 8 } ] }
    hell: { hp: 1.75, damage: 1.75, packSize: 2.8, eliteHp: 1.2, magicFind: 0.5, extraRushes: *extraRushes }
# coop (multiplayer migration step 6, sim/difficulty.ts, sim/revive.ts, docs/DECISIONS.md section Multiplayer
#   migration, steps 6 and 8): with n players enemy hp, damage, pack sizes, elite hp and the castle hp (castleHp)
#   are each x (1 + perPlayer x (n - 1))
#   on top of the difficulty (pack sizes stay capped by enemies.maxAlive); `chests` more chests per extra player, and
#   each player pays his own price curve. A fallen hero is revived by a living teammate who stands within
#   revive.radius for revive.seconds without a break; he comes back at revive.hpShare of his max hp. One player: x 1.
coop:
  # extraPlayers (2026-11-28, Petr: 3 and 4 players were far harder than 2): the count of extra players the
  # multipliers, the castle hp and the XP share use for 2, 3 and 4 players (before: 1, 2, 3, a straight line, but hp,
  # damage and pack size multiply, so the threat grew faster than the group); chests stay one per extra player.
  # Autopilot wins, gear none, 80 runs each (seeds 1-10, and 11-20): solo 25 %; 2 players 20 % / 21 %; 3 players
  # 9 % -> 24 % / 25 %; 4 players 1 % -> 16 % / 25 %. Tried 3 players at 1.3 (68 %), 1.5 (48 %), 1.8 (8 %); 4 players at
  # 1.5 (90 %), 1.8 (76 %), 2.3 (29 %), 2.5 (14 %).
  extraPlayers: [1, 1.7, 2.4]
  # hp 0.9 -> 0.5, damage 0.45 -> 0.22 (Petr's batch 3: 3 players without gear could not win): autopilot wins, gear none,
  # seeds 1-10, of 80 per size: 2 players 28, 3 players 14, 4 players 6 (solo 26 of 160); full gear 3 and 4: 40 of 40.
  perPlayer: { hp: 0.5, damage: 0.22, packSize: 0.3, eliteHp: 0.25, castleHp: 0.25, chests: 1 }
  revive: { seconds: 5, radius: 120, hpShare: 0.5 }
