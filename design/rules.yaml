# Run rules: a 5-minute run in 6 phases (phase 2b-1). Defaults, tuned by playing.
# Comments may name the origin in the map; they never reach data/generated/rules.json.
# The map's castle (hcas) has 155 000 HP and regenerates 200 HP/s.
# The map sends 7 units per gate per 30 s on Normal; the game sends packs (below).
# Tuned with `npm run sim:run -- --runs 5` (castle hp, hunterShare, xpStep) for the survivors pace.
start: { hero: stonehorn }
run:
  durationSeconds: 300
  phaseSeconds: 50
  firstPackSeconds: 2
  timeScaling: { seconds: 1200, cap: 2 }   # enemy HP and damage x min(cap, 1 + t / seconds), spec 3.2
arena:
  width: 6000
  height: 4400
  castle: { x: 0, y: -1700 }
  heroStart: { x: 0, y: -1200 }
  gates: [{ x: -1600, y: 1500 }, { x: 1600, y: 1500 }]
  gateRadius: 150
castle: { hp: 12000, radius: 180, regenPercentPerMinute: 2 }
hero: { collision: 32, baseRegen: 0.25, regenPerStr: 0.05, spellPowerPerInt: 0.01, cooldownSpeedPerInt: 0.01,
        dash: { distance: 350, seconds: 0.15, cooldownSeconds: 4 } }
autocast: { novaMinEnemies: 1, healBelow: 0.6, shieldBelow: 0.35 }
enemies: { maxAlive: 150, siegerAggroRange: 250, leashRange: 900, knockback: { attack: 40, ability: 90, seconds: 0.15 }, elite: captain }
# A phase sends packs: `mix` weights the enemy types, `pack` is the size and the interval, `hunterShare`
# the chance that a pack hunts the hero, `elites` the elites (enemies.elite) that come with its first pack.
phases:
  - { mix: { shieldbearer: 8, scout: 3 }, pack: { min: 6, max: 10, everySeconds: 6 }, hunterShare: 0.3, elites: 0 }
  - { mix: { shieldbearer: 6, scout: 3, musketeer: 2 }, pack: { min: 8, max: 12, everySeconds: 6 }, hunterShare: 0.35, elites: 0 }
  - { mix: { shieldbearer: 5, scout: 3, musketeer: 2, chaplain: 1, lancer: 1 }, pack: { min: 10, max: 14, everySeconds: 6 }, hunterShare: 0.35, elites: 1 }
  - { mix: { shieldbearer: 4, scout: 3, musketeer: 3, chaplain: 2, lancer: 2 }, pack: { min: 12, max: 16, everySeconds: 5 }, hunterShare: 0.4, elites: 1 }
  - { mix: { shieldbearer: 4, scout: 2, musketeer: 3, chaplain: 2, lancer: 3 }, pack: { min: 14, max: 18, everySeconds: 5 }, hunterShare: 0.4, elites: 2 }
  - { mix: { shieldbearer: 3, scout: 3, musketeer: 3, chaplain: 2, lancer: 3 }, pack: { min: 16, max: 20, everySeconds: 4 }, hunterShare: 0.45, elites: 2 }
progression: { xpFirst: 5, xpStep: 3, magnetRadius: 300, crystalSpeed: 900, pickupRadius: 56, attributeCardAmount: 10, cardsPerOffer: 3,
  ultimateFromLevel: 6, ultimateLevelStep: 6 }   # map: ultimates need hero level 10
