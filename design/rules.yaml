# Run rules: a run of 20 phases (16:40) that ends with the final boss (phase 2b-3). Defaults, tuned by playing.
# Comments may name the origin in the map; they never reach data/generated/rules.json.
# The map's castle (hcas) has 155 000 HP and regenerates 200 HP/s; ours has 58 000 for the 16:40 run (14 000 held 5 minutes).
# The map sends 7 units per gate per 30 s on Normal; the game sends packs (below).
# Tuned with `npm run sim:run -- --hero all --seeds 1-20` and the same with `--idle` (phases, castle hp, xpStep, finale);
# the targets and the results are in docs/DECISIONS.md.
start: { hero: stonehorn }
run:
  durationSeconds: 1000   # the final boss comes at this time; the run is won when it falls
  phaseSeconds: 50
  firstPackSeconds: 2
  # enemy HP and damage x min(cap, 1 + t / seconds), spec 3.2; cap 1 since 2026-11-26: enemies grow with the hero's
  # level instead (enemies.levelScaling), which gives about the same numbers on average
  timeScaling: { seconds: 1200, cap: 1 }
  rushWarningSeconds: 7   # the map warns 7 s ahead too
  # packScale: pack sizes of the last phase while the finale lasts. The enrage counts from the boss's arrival.
  finale: { boss: dread-regent, packScale: 0.35, enrageAfterSeconds: 200, enrage: { damage: 2, moveSpeed: 1.3, slamCooldown: 0.5 } }
arena:   # the castle stands in the middle; packs come from random directions on the spawn ring
  width: 6000
  height: 6000
  castle: { x: 0, y: 0 }
  heroStart: { x: 0, y: 500 }
  spawn: { radius: 2400, spread: 150 }
castle: { hp: 58000, radius: 180, regenPercentPerMinute: 1 }
hero: { collision: 32, baseRegen: 0.25, regenPerStr: 0.05, spellPowerPerInt: 0.005,   # spec 2026-11-19 4.2: was 0.01
        cooldownSpeedPerInt: 0.01,
        dash: { distance: 350, seconds: 0.15, cooldownSeconds: 4, charges: { fromLevel: 20, count: 3 } },
        # Petr 2026-11-26: 3 dash charges from level 20; the blink (F) from level 40: jump to the mouse, a stunning burst
        blink: { fromLevel: 40, cooldownSeconds: 10, maxDistance: 900, radius: 300, damage: 300, stunSeconds: 0.5 } }
autocast: { novaMinEnemies: 1, healBelow: 0.6, shieldBelow: 0.35 }
# Petr 2026-11-26: heroDefendRange: while the hero is within it of the castle every enemy goes for him (a solo hero
# fighting on one side no longer loses the castle to the other); levelScaling: new enemies grow with the hero level
# (hp and damage +0.9 % a level) in place of the time scaling: a hero ends a run near level 95, so the end is about
# x1.85 as before, but a hero who levels faster meets stronger enemies.
enemies: { maxAlive: 600, siegerAggroRange: 250, leashRange: 900, heroDefendRange: 1000, levelScaling: { hp: 0.009, damage: 0.009 }, knockback: { attack: 40, ability: 90, seconds: 0.15 }, bossStunScale: 0.25 }
# A phase sends `packs` packs every interval, each from its own side: `mix` weights the enemy types, `pack` is
# the size and the interval, `hunterShare` the chance that a pack hunts the hero, `elites` the elites
# (the elite of the phase's faction) that come with the first pack of the phase.
# Phases 6-20 (enemy factions, 2026-11-20): each faction's foot, shooter, heavy and caster keep the weights of the
# human roles in the same phase (foot = shieldbearer + scout), so only the types change, not the pressure by role.
phases:
  - { mix: { shieldbearer: 8, scout: 3 }, pack: { min: 6, max: 10, everySeconds: 6 }, packs: 2, hunterShare: 0.25, elites: 0 }   # 1
  - { mix: { shieldbearer: 6, scout: 3, musketeer: 2 }, pack: { min: 8, max: 11, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 0 }   # 2
  - { mix: { shieldbearer: 5, scout: 3, musketeer: 2, chaplain: 1, lancer: 1 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 1 }   # 3
  - { mix: { shieldbearer: 4, scout: 3, musketeer: 3, chaplain: 2, lancer: 2 }, pack: { min: 9, max: 13, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 1 }   # 4
  - { mix: { shieldbearer: 4, scout: 2, musketeer: 3, chaplain: 2, lancer: 3 }, pack: { min: 7, max: 10, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 5
  - { mix: { brute: 7, spearthrower: 3, hornback: 3, bloodcaller: 2 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 6
  - { mix: { brute: 7, spearthrower: 3, hornback: 3, bloodcaller: 2 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 7
  - { mix: { brute: 7, spearthrower: 3, hornback: 3, bloodcaller: 2 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 4, hunterShare: 0.35, elites: 1 }   # 8
  - { mix: { brute: 6, spearthrower: 3, hornback: 3, bloodcaller: 2 }, pack: { min: 9, max: 13, everySeconds: 5 }, packs: 4, hunterShare: 0.35, elites: 2 }   # 9
  - { mix: { brute: 6, spearthrower: 3, hornback: 3, bloodcaller: 2 }, pack: { min: 9, max: 13, everySeconds: 5 }, packs: 4, hunterShare: 0.35, elites: 2 }   # 10
  - { mix: { ghoul: 6, webcrawler: 3, rotgut: 3, gravebinder: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 11
  - { mix: { ghoul: 6, webcrawler: 3, rotgut: 3, gravebinder: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 12
  - { mix: { ghoul: 6, webcrawler: 3, rotgut: 3, gravebinder: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 4, hunterShare: 0.4, elites: 2 }   # 13
  - { mix: { ghoul: 6, webcrawler: 4, rotgut: 3, gravebinder: 2 }, pack: { min: 10, max: 14, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 14
  - { mix: { ghoul: 6, webcrawler: 4, rotgut: 3, gravebinder: 2 }, pack: { min: 10, max: 14, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 15
  - { mix: { huntress: 6, moon-archer: 4, stone-warden: 4, grove-druid: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 16
  - { mix: { huntress: 6, moon-archer: 4, stone-warden: 4, grove-druid: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 17
  - { mix: { huntress: 6, moon-archer: 4, stone-warden: 4, grove-druid: 2 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 2 }   # 18
  - { mix: { huntress: 5, moon-archer: 4, stone-warden: 4, grove-druid: 2 }, pack: { min: 12, max: 16, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 3 }   # 19
  - { mix: { huntress: 5, moon-archer: 4, stone-warden: 4, grove-druid: 2 }, pack: { min: 12, max: 16, everySeconds: 5 }, packs: 6, hunterShare: 0.4, elites: 3 }   # 20
# Enemy factions by phase (spec 2026-11-20): `elite` comes as the elite of their phases and leads their rushes,
# `heavy` follows it in a rush.
factions:
  - { id: human, name: { en: Human Legion, cs: Lidská legie }, fromPhase: 1, elite: captain, heavy: lancer }
  - { id: orc, name: { en: Blood Clan, cs: Krvavý klan }, fromPhase: 6, elite: warlord, heavy: hornback }
  - { id: undead, name: { en: Restless Dead, cs: Neklidní mrtví }, fromPhase: 11, elite: bone-tyrant, heavy: rotgut }
  - { id: elf, name: { en: Moon Grove, cs: Měsíční háj }, fromPhase: 16, elite: grove-warden, heavy: stone-warden }
# Timed events, ascending by time. A rush is one pack of siegers from one side, announced rushWarningSeconds ahead:
# `elites` elites and then `heavies` heavy types of the faction of the phase the rush comes in; a boss comes alone.
events:
  - { atSeconds: 180, kind: rush, elites: 2, heavies: 3 }
  - { atSeconds: 250, kind: boss, enemy: iron-marshal }
  - { atSeconds: 360, kind: rush, elites: 4, heavies: 6 }
  - { atSeconds: 500, kind: boss, enemy: pale-abbot }
  - { atSeconds: 540, kind: rush, elites: 5, heavies: 8 }
  - { atSeconds: 720, kind: rush, elites: 6, heavies: 10 }
  - { atSeconds: 750, kind: boss, enemy: gunmaster }
  - { atSeconds: 900, kind: rush, elites: 8, heavies: 12 }
# XP a hero has at the start of each phase, for ?phase=N. Filled from `npm run sim:run -- --phase-xp`.
debug: { phaseXp: [0, 45, 105, 207, 374, 580, 975, 1235, 1561, 1922, 2314, 3086, 3663, 4176, 4822, 5623, 6708, 7628, 8513, 9579] }
# threat: multiplies all damage enemies deal to the hero (sim/combat.ts damageHero: hits, shots, charges, boss
#   strikes, slams), times the hero's own damageTaken (heroes.yaml). The castle takes damage as before.
threat: { heroDamageTaken: 2 }
# sustain (spec 2026-11-19 sustain, sim/buffs.ts, sim/orbs.ts): lifesteal from gear heals at most capPerSecond x max hp
#   a second; a common enemy drops a heart with hearts.chance (elites and bosses always), a heart heals healShare x
#   max hp. Up to orbs.maxOnMap orbs lie between min and maxCastleDistance from the castle, minSpacing apart and
#   chestSpacing from chests; place i first spawns at firstSeconds[i], then respawnSeconds after a pickup. An orb lasts
#   buffSeconds: boots x moveSpeed, berserk x damage on everything the hero deals, heal share x max hp over the time.
sustain:
  buffSeconds: 15
  lifesteal: { capPerSecond: 0.02 }
  hearts: { chance: 0.04, healShare: 0.08 }
  orbs: { maxOnMap: 3, firstSeconds: [8, 20, 32], respawnSeconds: { min: 30, max: 45 }, minCastleDistance: 300,
    maxCastleDistance: 2000, minSpacing: 500, chestSpacing: 200, pickupRadius: 70 }
  boots: { moveSpeed: 2 }
  berserk: { damage: 1.5 }
  heal: { share: 1 }
# Gear (items, chests, boss drops). Tuned in docs/DECISIONS.md, section Gear, drops and chests.
# gear: an item's numbers with permanent level B and chest levels T are its level-1 numbers
#   x (1 + levelStep x max(B - 1, 0) + chestLevelStep x T); an item a chest gave has B = 0, so its first chest level
#   counts too. A duplicate from a boss raises the permanent level up to maxPermanentLevel, chests add levels without
#   a cap. chestLevelStep is tuned with `npm run sim:chests` (docs/DECISIONS.md, section Chest loot).
gear: { levelStep: 0.15, chestLevelStep: 0.25, maxPermanentLevel: 5 }
# chests: `count` chests lie between min and maxCastleDistance from the castle and minSpacing apart. The n-th chest
#   opened costs basePrice x priceGrowth^(n - 1) gold and offers slotsPerOffer cards. Each card rolls a rarity by
#   rarityWeights (raised by the hero's magic find), then a free slot whose type has an item of that rarity (one
#   rarity lower when none is free) and an item of it (sim/chests.ts). An empty slot takes the item at chest level 1,
#   a higher rarity replaces the worn item with the slot's whole level + 1, else the worn item gains a level.
chests: { count: 3, basePrice: 100, priceGrowth: 1.12, minCastleDistance: 700, maxCastleDistance: 2000, minSpacing: 600, pickupRadius: 80, slotsPerOffer: 3,
  rarityWeights: { common: 25, rare: 30, epic: 37, legendary: 6, mythic: 2 } }
# magicFind: the hero's magic find MF (sum over worn items, 0.12 = 12 %) has diminishing returns:
#   effective = MF x limit / (MF + limit) (50 % -> 37.5 %, 100 % -> 60 %, 300 % -> 100 %). Every rarity above the
#   lowest one of a weight table (chests, boss drops) gets its weight x (1 + effective x rarityFactor); the lowest
#   keeps its weight (sim/magic-find.ts).
magicFind: { limit: 1.5, rarityFactor: { rare: 1, epic: 1.5, legendary: 2, mythic: 2.5 } }
# drops: every boss drops one item; its rarity is drawn by these weights (meta/drop.ts).
drops:
  - { boss: iron-marshal, weights: { common: 60, rare: 40 } }
  - { boss: pale-abbot, weights: { rare: 60, epic: 40 } }
  - { boss: gunmaster, weights: { epic: 75, legendary: 25 } }
  - { boss: dread-regent, weights: { epic: 50, legendary: 40, mythic: 10 } }
progression: { xpFirst: 10, xpStep: 9, magnetRadius: 300, crystalSpeed: 900, pickupRadius: 56, attributeCardAmount: 10, cardsPerOffer: 3,
  ultimateFromLevel: 6, ultimateLevelStep: 6,   # map: ultimates need hero level 10
  # Shared spells and passives (docs/DECISIONS.md, section Shared spells and passives): the pools, the
  # number of slots, and the weights of the four card groups (a group is drawn by weight, then a card in it).
  sharedSpells: [arc-lightning, smite, fire-bolt, frost-ring, meteor, holy-ground, blade-fan, shock-wave, sentry-ward, second-wind],
  passives: [might, arcane-focus, haste, vigor, fleet-foot, fortune],
  sharedSpellSlots: 2, passiveSlots: 4,
  cardWeights: { signature: 4, sharedUpgrade: 3, newSpell: 2, newPassive: 2 } }
# difficulty (spec 2026-11-21 difficulties and worlds 4.2, sim/difficulty.ts, docs/DECISIONS.md section Difficulties
#   and worlds): enemy hp and damage x level.hp / level.damage x (1 + worldStep x (world - 1)); pack sizes x packSize
#   (the cap of enemies.maxAlive stays); elites and bosses get eliteHp on top; extraRushes come on top of `events`
#   (elites and heavies of the phase's faction, announced like the others). Rewards: gold from enemies
#   x (1 + goldPerWorld x (world - 1)), magic find + magicFindPerWorld x (world - 1) + level.magicFind.
#   World 1 on normal is the game as it was before the worlds.
difficulty:
  worldStep: { hp: 0.035, damage: 0.035 }
  reward: { goldPerWorld: 0.1, magicFindPerWorld: 0.1 }
  levels:
    normal: { hp: 1, damage: 1, packSize: 2, eliteHp: 1, magicFind: 0, extraRushes: [] }
    insane: { hp: 1.35, damage: 1.35, packSize: 2.4, eliteHp: 1, magicFind: 0.25, extraRushes: &extraRushes [
      { atSeconds: 90, elites: 1, heavies: 2 },
      { atSeconds: 270, elites: 2, heavies: 3 },
      { atSeconds: 450, elites: 3, heavies: 4 },
      { atSeconds: 630, elites: 4, heavies: 6 },
      { atSeconds: 810, elites: 5, heavies: 8 } ] }
    hell: { hp: 1.75, damage: 1.75, packSize: 2.8, eliteHp: 1.2, magicFind: 0.5, extraRushes: *extraRushes }
# coop (multiplayer migration step 6, sim/difficulty.ts, sim/revive.ts, docs/DECISIONS.md section Multiplayer
#   migration, steps 6 and 8): with n players enemy hp, damage, pack sizes, elite hp and the castle hp (castleHp)
#   are each x (1 + perPlayer x (n - 1))
#   on top of the difficulty (pack sizes stay capped by enemies.maxAlive); `chests` more chests per extra player, and
#   each player pays his own price curve. A fallen hero is revived by a living teammate who stands within
#   revive.radius for revive.seconds without a break; he comes back at revive.hpShare of his max hp. One player: x 1.
coop:
  perPlayer: { hp: 0.9, damage: 0.45, packSize: 0.3, eliteHp: 0.25, castleHp: 0.25, chests: 1 }
  revive: { seconds: 5, radius: 120, hpShare: 0.5 }
