# Run rules: a 5-minute run in 6 phases (phases 2b-1 and 2b-2). Defaults, tuned by playing.
# Comments may name the origin in the map; they never reach data/generated/rules.json.
# The map's castle (hcas) has 155 000 HP and regenerates 200 HP/s.
# The map sends 7 units per gate per 30 s on Normal; the game sends packs (below).
# Tuned with `npm run sim:run -- --hero all --runs 5` and the same with `--idle` (hunterShare, xpFirst, xpStep);
# the targets and the results are in docs/DECISIONS.md.
start: { hero: stonehorn }
run:
  durationSeconds: 300
  phaseSeconds: 50
  firstPackSeconds: 2
  timeScaling: { seconds: 1200, cap: 2 }   # enemy HP and damage x min(cap, 1 + t / seconds), spec 3.2
arena:   # the castle stands in the middle; packs come from random directions on the spawn ring
  width: 6000
  height: 6000
  castle: { x: 0, y: 0 }
  heroStart: { x: 0, y: 500 }
  spawn: { radius: 2400, spread: 150 }
castle: { hp: 14000, radius: 180, regenPercentPerMinute: 1 }
hero: { collision: 32, baseRegen: 0.25, regenPerStr: 0.05, spellPowerPerInt: 0.01, cooldownSpeedPerInt: 0.01,
        dash: { distance: 350, seconds: 0.15, cooldownSeconds: 4 } }
autocast: { novaMinEnemies: 1, healBelow: 0.6, shieldBelow: 0.35 }
enemies: { maxAlive: 150, siegerAggroRange: 250, leashRange: 900, knockback: { attack: 40, ability: 90, seconds: 0.15 }, elite: captain }
# A phase sends `packs` packs every interval, each from its own side: `mix` weights the enemy types, `pack` is
# the size and the interval, `hunterShare` the chance that a pack hunts the hero, `elites` the elites
# (enemies.elite) that come with the first pack of the phase.
phases:
  - { mix: { shieldbearer: 8, scout: 3 }, pack: { min: 6, max: 10, everySeconds: 6 }, packs: 1, hunterShare: 0.25, elites: 0 }
  - { mix: { shieldbearer: 6, scout: 3, musketeer: 2 }, pack: { min: 8, max: 11, everySeconds: 6 }, packs: 1, hunterShare: 0.3, elites: 0 }
  - { mix: { shieldbearer: 5, scout: 3, musketeer: 2, chaplain: 1, lancer: 1 }, pack: { min: 8, max: 12, everySeconds: 6 }, packs: 2, hunterShare: 0.3, elites: 1 }
  - { mix: { shieldbearer: 4, scout: 3, musketeer: 3, chaplain: 2, lancer: 2 }, pack: { min: 10, max: 14, everySeconds: 6 }, packs: 2, hunterShare: 0.35, elites: 1 }
  - { mix: { shieldbearer: 4, scout: 2, musketeer: 3, chaplain: 2, lancer: 3 }, pack: { min: 9, max: 13, everySeconds: 5 }, packs: 2, hunterShare: 0.35, elites: 2 }
  - { mix: { shieldbearer: 3, scout: 3, musketeer: 3, chaplain: 2, lancer: 3 }, pack: { min: 11, max: 15, everySeconds: 5 }, packs: 3, hunterShare: 0.4, elites: 2 }
progression: { xpFirst: 10, xpStep: 8, magnetRadius: 300, crystalSpeed: 900, pickupRadius: 56, attributeCardAmount: 10, cardsPerOffer: 3,
  ultimateFromLevel: 6, ultimateLevelStep: 6 }   # map: ultimates need hero level 10
