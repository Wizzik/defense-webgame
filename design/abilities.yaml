      Trig_Special_Actions for 10 s; it fires every 0.5 s (line 30397), which gives ticksPerSecond 2 and
      duration 10. Each firing deals 500 + 2 x agility (Trig_Special_Func018Func002002, 20748, and
      Trig_Special_Func018Func001002, 20740) to enemies within 500 at ability level 1 and within 1500 at level 2
      (Trig_Special_Actions, 20775-20781). The agility part is not mapped. Level 1 tickDamage is the script's 500.
      Level 2 in the script keeps 500 and triples the radius; the game keeps the object data area (500) on both
      levels and raises the tick to 900 in its place (design value, the plan's stand-in for level 2).
