    damage: { design: [933, 4660] }
    radius: area
    slow: DataC
    slowSeconds: duration
  review:
    jassFunctions:
      - Trig_Ghost_Angry_Actions
    notes: >-
      Trig_Ghost_Angry_Actions (war3map.j v20.75, lines 17149-17155) sets the damage to 100 x hero level at
      ability level 1 and 250 x hero level at level 2 (Trig_Ghost_Angry_Func003C, 17046, tells the levels apart),
      and deals it in 15 growing rings of 12 circles (radius 250) around the caster. The game has no damage per
      hero level, so damage is a design value: the script's amount at the hero level that unlocks each ability
      level in the map (10 and 20): 1000 and 5000. The plan's stand-in values (3000, 8000) were not needed.
      radius, slow and slowSeconds are object data.

# Sparkshot

- id: rocket-fan
  source: A06L
  name: { en: Rocket Fan, cs: Raketový vějíř }
  description: { en: "A fan of rockets aims itself at the thickest crowd.", cs: "Vějíř raket sám zamíří na největší shluk." }
  # Petr's batch 2, task 7: a cone that aims itself at the thickest crowd instead of a nova around the hero; a
  # ranged hero keeps its distance and the nova never had enemies inside it.
  kind: cone
  targeting: densest_cluster
  params:
    # Tuned in phase 2b-2, task 6 (docs/DECISIONS.md): 400 doubling per level (see review) x 0.48.
    damage: { design: [193, 383, 760, 1520, 3040] }
    length: { design: [900, 900, 900, 900, 900] }
    endWidth: { design: [600, 600, 600, 600, 600] }
    maxTargets: { design: [16, 16, 16, 16, 16] }
  review:
    jassFunctions:
      - Trig_Fan_of_Rocket_Func002A
      - Trig_Fan_of_Rocket_Actions
    notes: >-
      Trig_Fan_of_Rocket_Actions (war3map.j v20.75, line 16026) picks every enemy within 1000 of the caster and
      Trig_Fan_of_Rocket_Func002A (16015-16020) creates one rocket unit (h01U, timed life 1 s) per enemy that
      attacks it; the rocket's attack is 401 at every ability level (units.json). Level 1 damage is that 401
      rounded to 400; the script does not raise it with the level, so the later levels double it as the map's
      other spells of this tier do (design values). radius is a design value: the script's 1000 covers the whole
      screen, the game uses 600 (the plan's stand-in).

