- id: rocket-fan
  source: A06L
  name: { en: Rocket Fan, cs: Raketový vějíř }
  description: { en: "Rockets hit every enemy around you.", cs: "Rakety zasáhnou každého nepřítele kolem tebe." }
  kind: nova
  targeting: around_self
  params:
    # Tuned in phase 2b-2, task 6 (docs/DECISIONS.md): 400 doubling per level (see review) x 0.48.
    damage: { design: [193, 383, 760, 1520, 3040] }
    radius: { design: [600, 600, 600, 600, 600] }
  review:
    jassFunctions:
      - Trig_Fan_of_Rocket_Func002A
      - Trig_Fan_of_Rocket_Actions
    notes: >-
      Trig_Fan_of_Rocket_Actions (war3map.j v20.75, line 16026) picks every enemy within 1000 of the caster and
      Trig_Fan_of_Rocket_Func002A (16015-16020) creates one rocket unit (h01U, timed life 1 s) per enemy that
      attacks it; the rocket's attack is 401 at every ability level (units.json). Level 1 damage is that 401
      rounded to 400; the script does not raise it with the level, so the later levels double it as the map's
      other spells of this tier do (design values). radius is a design value: the script's 1000 covers the whole
      screen, the game uses 600 (the plan's stand-in).

