# MVP abilities. The names are working names and may change.
# source: ability code in the map export (abilities.json). cooldown comes from the export
#   times abilities.cooldown in design/scaling.yaml (data-build applies it to every level).
# description: the player-facing text of the ability, written for the game (never copied from the map).
# Each param names where its per-level numbers come from:
#   DataA ... DataI                      object data field of the ability
#   cooldown | area | range | duration   per-level field of the ability
#   { design: [...] }                    one value per level, written here
# A missing export value takes the value of the level before; on level 1 it gives 0.
# review is allowed only on script-backed abilities. It holds notes for the port (jassFunctions: the
#   functions that design values come from; notes: where each value comes from). data-build checks
#   it but never writes it to data/generated.

# Stonehorn

- id: rock-rupture
  source: A0A7
  name: { en: Rock Rupture, cs: Skalní zlom }
  description: { en: "A line of stone spikes that stuns.", cs: "Řada kamenných hrotů, která omráčí." }
  kind: line
  targeting: move_direction
  params:
    damage: DataC
    length: DataA
    width: area
    stunSeconds: duration
    # The map's Wave Time is 0, so the speed is a design value.
    waveSpeed: { design: [2000, 2000, 2000, 2000, 2000] }

- id: enhanced-totem
  source: A0A8
  name: { en: Enhanced Totem, cs: Posílený totem }
  description: { en: "Every few seconds your next attack hits far harder.", cs: "Každých pár sekund udeří další útok mnohem silněji." }
  kind: on_hit
  targeting: on_attack
  params:
    # DataA is Damage Increase 3, 5, 7, 9, 10 (+300 % to +1000 %).
    empower: DataA
  review:
    notes: >-
      Trig_AllStun_Func001Func002C belongs to the Trig_AllStun_* trigger (war3map.j v20.75, lines 27704-27739),
      which answers casts of A0A7, A0AA or A0A8 by O00C with the seismic-echo stun (see seismic-echo).
      A0A8 is the only ability that applies buff B00U. Trig_Attacked_Entotem_Conditions/Actions (27664-27676)
      and Trig_DealDamage_Conditions/Actions (27678-27690) remove B00U from the attacker after the attacked unit
      takes damage from it, so the buff lasts for one hit and has no radius, no splash.
      The size of that hit is object data, not script: DataA damage increase 3, 5, 7, 9, 10 (empower).
      AI_Setup (33277-33279) only stores AI hints.

- id: seismic-echo
  source: A00M
  name: { en: Seismic Echo, cs: Seizmická ozvěna }
  description: { en: "Each of your spells sends a stunning shockwave around you.", cs: "Každé tvé kouzlo vyšle kolem tebe omračující otřes." }
  kind: on_cast
  targeting: on_cast
  params:
    damage: { design: [150, 300, 450, 600, 750] }
    radius: { design: [350, 350, 350, 350, 350] }
    stunSeconds: { design: [1, 1.5, 2, 2.5, 3] }
  review:
    notes: >-
      The values are design values taken from the helper spell below (A0A9) and are used now:
      the sim casts the stun after each of the hero's own spells.
      Trig_Learn_Allstun_Conditions/Actions (war3map.j v20.75, lines 27692-27702) enable the Trig_AllStun_* trigger
      once A00M is learned. Trig_AllStun_Func001Func002C, Trig_AllStun_Func001C and Trig_AllStun_Conditions
      (27704-27732) let it fire on every cast of A0A7, A0AA or A0A8 by O00C, with no chance roll.
      Trig_AllStun_Actions (27734-27739) then creates one dummy unit (e012, timed life 1 s) that casts A0A9
      at the caster's A00M level. Stun length and damage are A0A9's object data, not script:
      duration 1, 1.5, 2, 2.5, 3; DataA damage 150, 300, 450, 600, 750; area 350.
      AI_Setup (32758) only lists A00M as hero slot 2 of O00C.

