# MVP abilities. The names are working names and may change.
# source: ability code in the map export (abilities.json). cooldown always comes from the export.
# Each param names where its per-level numbers come from:
#   DataA ... DataI                      object data field of the ability
#   cooldown | area | range | duration   per-level field of the ability
#   { design: [...] }                    one value per level, written here
# A missing export value takes the value of the level before; on level 1 it gives 0.
# review.notes is allowed only on script-backed abilities; data-build adds reason and jassFunctions.

# Stonehorn

- id: rock-rupture
  source: A0A7
  name: { en: Rock Rupture, cs: Skalní zlom }
  kind: line
  targeting: move_direction
  params:
    damage: DataC
    length: DataA
    width: area
    stunSeconds: duration

- id: cleaving-blows
  source: A0A8
  name: { en: Cleaving Blows, cs: Drtivé údery }
  kind: on_hit
  targeting: on_attack
  params:
    splashRadius: { design: [0, 0, 0, 0, 0] }
    splashPercent: { design: [0, 0, 0, 0, 0] }
  review:
    notes: >-
      splashRadius and splashPercent are 0 because no listed function holds a splash value.
      Trig_AllStun_Func001Func002C only checks whether the cast ability is A0A7, A0AA or A0A8.
      AI_Setup only stores AI hints for A0A8 in udg_AIHT (slot 1 of hero O00C; an order id, 4 and 700),
      as it does for every hero ability.

- id: concussion
  source: A00M
  name: { en: Concussion, cs: Otřes }
  kind: on_hit
  targeting: on_attack
  params:
    chance: { design: [0, 0, 0, 0, 0] }
    stunSeconds: { design: [0, 0, 0, 0, 0] }
    bonusDamage: { design: [0, 0, 0, 0, 0] }
  review:
    notes: >-
      chance, stunSeconds and bonusDamage are 0 because no listed function holds these values.
      Trig_Learn_Allstun_Conditions only checks that A00M was learned.
      Trig_AllStun_Actions creates one dummy unit with a timed life of 1 s and has it cast ability A0A9
      at the caster's A00M level, so the effect comes from A0A9 and the trigger has no chance, stun or damage number.
      AI_Setup only lists A00M as slot 2 of hero O00C.

- id: earthquake
  source: A0AA
  name: { en: Earthquake, cs: Zemětřesení }
