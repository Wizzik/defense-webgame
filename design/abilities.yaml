# Serpent Shaman

- id: serpent-totem
  source: A062
  name: { en: Serpent Totem, cs: Hadí totem }
  description: { en: "Raises snake totems that bite nearby enemies.", cs: "Postaví hadí totemy, které koušou nepřátele v okolí." }
  kind: summon
  targeting: densest_cluster
  params:
    count: DataA
    duration: duration
    range: range
    # The map's totem attacks for 101, finds a target within 600 and has an attack interval of 1.0 s,
    # which is multiplied by heroes.attackCooldown 0.5. The cap on living totems is our own.
    damage: { design: [101, 101, 101, 101, 101] }
    attackRange: { design: [600, 600, 600, 600, 600] }
    attackInterval: { design: [0.5, 0.5, 0.5, 0.5, 0.5] }
    maxAlive: { design: [3, 6, 9, 12, 15] }

