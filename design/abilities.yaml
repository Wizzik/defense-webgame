# Serpent Shaman

- id: serpent-totem
  source: A062
  name: { en: Serpent Totem, cs: Hadí totem }
  description: { en: "Raises snake totems that bite nearby enemies.", cs: "Postaví hadí totemy, které koušou nepřátele v okolí." }
  kind: summon
  targeting: densest_cluster
  # The map's cooldown is 5, 7, 9, 12, 15. Petr set one slow cast for every level on 2026-11-12, the same
  # as Wisp Ward: with the small cap below, each cast moves half of the totems to the fight.
  cooldown: { design: [15, 15, 15, 15, 15] }
  params:
    # The map's DataA is 1, 2, 3, 4, 5. Petr's values of 2026-11-12, shared with Wisp Ward.
    count: { design: [1, 2, 2, 3, 3] }
    duration: duration
    range: range
    # The map's totem attacks for 101, finds a target within 600 and has an attack interval of 1.0 s,
    # which is multiplied by heroes.attackCooldown 0.5. The cap on living totems is our own.
    # The map's ward attacks for 101; Petr halved it on 2026-11-11 (the Serpent Shaman won every run).
    # 60 since 2026-11-12: with the cap of 2-6 totems and the slow cast, 50 won 1 of 5 test seeds and 75 won 15 of 15.
    damage: { design: [60, 60, 60, 60, 60] }
    attackRange: { design: [600, 600, 600, 600, 600] }
    attackInterval: { design: [0.5, 0.5, 0.5, 0.5, 0.5] }
    # Petr's values of 2026-11-12 (was 3, 6, 9, 12, 15), shared with Wisp Ward.
    maxAlive: { design: [2, 4, 4, 6, 6] }

