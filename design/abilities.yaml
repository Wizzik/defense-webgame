- id: stunning-tide
  source: A00Q
  name: { en: Stunning Tide, cs: Omračující příliv }
  description: { en: "Your attacks sometimes hit harder and stun.", cs: "Tvoje útoky občas udeří silněji a omráčí." }
  kind: on_hit
  targeting: on_attack
  params:
    # DataA is the chance in percent (17.5 on every level); the game reads a share of 1.
    chance: { design: [0.175, 0.175, 0.175, 0.175, 0.175] }
    bonusDamage: DataC
    stunSeconds: duration

- id: riptide
  source: A0BD
  name: { en: Riptide, cs: Zpětný proud }
  description: { en: "A bolt of water strikes the nearest enemy hard.", cs: "Vodní střela tvrdě zasáhne nejbližšího nepřítele." }
  kind: projectile
  targeting: nearest_elite_first
  params:
    # Tuned in phase 2b-2, task 6 (docs/DECISIONS.md): the script values 500 to 6000 (see review) x 0.6.
    damage: { design: [300, 600, 1200, 1800, 3600] }
    range: range
    speed: { design: [1400, 1400, 1400, 1400, 1400] }
  review:
    jassFunctions:
      - Trig_Wave_Form_Move_Func006A
    notes: >-
      damage per level is the UnitDamageTargetBJ amount in Trig_Wave_Form_Move_Func006A (war3map.j v20.75,
      lines 28104-28116): 500, 1000, 2000, 3000 and 6000; level 5 also adds the hero's agility, which is not
      mapped. In the map the hero itself slides along a line and hits everything within 450 of it
      (Trig_Wave_Form_Move_Actions, 28141); the game maps it to one seeking bolt, so speed is a design value
      and range is the object data range (1500).

- id: drowned-lake
  source: A04P
  name: { en: Drowned Lake, cs: Utopené jezero }
  description: { en: "A lake rises around you and keeps drowning enemies.", cs: "Kolem tebe se zvedne jezero a topí nepřátele." }
  kind: ticking_area
  targeting: densest_cluster
  params:
    radius: area
    # Tuned in phase 2b-2, task 6 (docs/DECISIONS.md): 500 and 900 (see review) x 0.6.
    # Petr 2026-11-26: bursts as often and as wide as the Gravecaller's Bone Stampede (same tick, rate, burst radius).
    tickDamage: { design: [100, 500] }
    ticksPerSecond: { design: [10, 11] }
    hitRadius: { design: [275, 350] }
    duration: { design: [10, 10] }
  review:
    jassFunctions:
      - Trig_Dead_Lake_Cast_Actions
      - Trig_Special_Actions
      - Trig_Special_Func018Func001002
      - Trig_Special_Func018Func002002
    notes: >-
      Trig_Dead_Lake_Cast_Actions (war3map.j v20.75, lines 20695-20701) enables the periodic trigger of
      Trig_Special_Actions for 10 s; it fires every 0.5 s (line 30397), which gives ticksPerSecond 2 and
      duration 10. Each firing deals 500 + 2 x agility (Trig_Special_Func018Func002002, 20748, and
      Trig_Special_Func018Func001002, 20740) to enemies within 500 at ability level 1 and within 1500 at level 2
      (Trig_Special_Actions, 20775-20781). The agility part is not mapped. Level 1 tickDamage is the script's 500.
      Level 2 in the script keeps 500 and triples the radius; the game keeps the object data area (500) on both
      levels and raises the tick to 900 in its place (design value, the plan's stand-in for level 2).

# Shared spells (pool): any hero can learn two of them from cards (rules.progression.sharedSpells).
# Sources are hero spells of the map that none of our eight heroes uses, of a matching kind; values the
# map does not carry, or that would beat a signature spell, are design values (docs/DECISIONS.md,
# section Shared spells and passives). Target: a shared spell on level 5 is about a signature spell of
# the same kind on level 3-4.

- id: arc-lightning
  source: A069
  name: { en: Arc Lightning, cs: Jiskrový řetěz }
  description: { en: "Lightning strikes the nearest enemy and leaps from foe to foe.", cs: "Blesk udeří do nejbližšího nepřítele a přeskakuje na další." }
  kind: chain
  targeting: nearest
  params:
    # The map's 500 to 6000 per target hits 16 targets; ours hits far fewer, so the damage is a design value.
    damage: { design: [300, 600, 1000, 1500, 2000] }
    range: { design: [900, 900, 900, 900, 900] }
    bounces: { design: [2, 3, 4, 5, 6] }
    bounceRange: { design: [500, 500, 500, 500, 500] }

- id: smite
  source: A03U
  name: { en: Smite, cs: Úder shůry }
  description: { en: "A bolt from above strikes the strongest foe in reach; bosses and elites first.", cs: "Rána shůry zasáhne nejsilnějšího nepřítele v dosahu; bossové a elity mají přednost." }
  kind: instant
  targeting: strongest
  params:
    # The map's 200 to 1600 are too low for the one hit that hunts bosses.
    damage: { design: [500, 1000, 1800, 2800, 4000] }
    range: { design: [1000, 1000, 1000, 1000, 1000] }

