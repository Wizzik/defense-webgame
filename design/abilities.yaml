# MVP abilities. The names are working names and may change.
# source: ability code in the map export (abilities.json). cooldown always comes from the export.
# Each param names where its per-level numbers come from:
#   DataA ... DataI                      object data field of the ability
#   cooldown | area | range | duration   per-level field of the ability
#   { design: [...] }                    one value per level, written here
# A missing export value takes the value of the level before; on level 1 it gives 0.
# review is allowed only on script-backed abilities. data-build adds reason and the export's
#   jass_functions; review.jassFunctions here are appended after them (the functions that design
#   values come from), and review.notes says where each value comes from.

# Stonehorn

- id: rock-rupture
  source: A0A7
  name: { en: Rock Rupture, cs: Skalní zlom }
  kind: line
  targeting: move_direction
  params:
    damage: DataC
    length: DataA
    width: area
    stunSeconds: duration

- id: cleaving-blows
  source: A0A8
  name: { en: Cleaving Blows, cs: Drtivé údery }
  kind: on_hit
  targeting: on_attack
  params:
    splashRadius: { design: [0, 0, 0, 0, 0] }
    splashPercent: { design: [0, 0, 0, 0, 0] }
  review:
    notes: >-
      splashRadius and splashPercent are 0: no trigger code holds a splash radius or percentage.
      Trig_AllStun_Func001Func002C belongs to the Trig_AllStun_* trigger (war3map.j v20.75, lines 27704-27739),
      which answers casts of A0A7, A0AA or A0A8 by O00C with the concussion stun (see concussion).
      A0A8 is the only ability that applies buff B00U. Trig_Attacked_Entotem_Conditions/Actions (27664-27676)
      and Trig_DealDamage_Conditions/Actions (27678-27690) remove B00U from the attacker after the attacked unit
      takes damage from it, so the buff lasts for one hit and has no radius.
      The size of that hit is object data, not script: DataA damage increase 3, 5, 7, 9, 10.
      AI_Setup (33277-33279) only stores AI hints.

- id: concussion
  source: A00M
  name: { en: Concussion, cs: Otřes }
  kind: on_hit
  targeting: on_attack
  params:
    chance: { design: [0, 0, 0, 0, 0] }
    stunSeconds: { design: [0, 0, 0, 0, 0] }
    bonusDamage: { design: [0, 0, 0, 0, 0] }
  review:
    notes: >-
      chance, stunSeconds and bonusDamage are 0: no trigger code holds these values.
      Trig_Learn_Allstun_Conditions/Actions (war3map.j v20.75, lines 27692-27702) enable the Trig_AllStun_* trigger
      once A00M is learned. Trig_AllStun_Func001Func002C, Trig_AllStun_Func001C and Trig_AllStun_Conditions
      (27704-27732) let it fire on every cast of A0A7, A0AA or A0A8 by O00C, with no chance roll.
      Trig_AllStun_Actions (27734-27739) then creates one dummy unit (e012, timed life 1 s) that casts A0A9
      at the caster's A00M level. Stun length and damage are A0A9's object data, not script:
      duration 1, 1.5, 2, 2.5, 3; DataA damage 150, 300, 450, 600, 750; area 350.
      AI_Setup (32758) only lists A00M as hero slot 2 of O00C.

