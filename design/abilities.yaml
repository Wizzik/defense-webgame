# Gravecaller

- id: grave-grasp
  source: A02H
  name: { en: Grave Grasp, cs: Hrobový stisk }
  description: { en: "Strikes the thickest crowd and heals you for every hit.", cs: "Udeří do největšího shluku a za každý zásah tě vyléčí." }
  kind: area
  targeting: densest_cluster
  params:
    radius: area
    range: range
    damage: { design: [400, 800, 1600, 3200, 6400] }
    # The map heals 50 to 300. Phase 2b-2 lowered it to 10-60 (with the map's values the hero was never in
    # danger) and Petr cut that by another 75 % on 2026-11-11.
    healPerHit: { design: [2.5, 5, 7.5, 10, 15] }
  review:
    jassFunctions:
      - Trig_Dead_Catch_Func003Func002A
      - Trig_Dead_Catch_Func003Func001Func002A
      - Trig_Dead_Catch_Func003Func001Func001Func002A
      - Trig_Dead_Catch_Func003Func001Func001Func001Func002A
      - Trig_Dead_Catch_Func003Func001Func001Func001Func001Func002A
    notes: >-
      damage per level is the UnitDamageTargetBJ amount in the group callbacks that Trig_Dead_Catch_Actions runs
      for each A02H level (war3map.j v20.75): 400 (Trig_Dead_Catch_Func003Func002A, line 18020),
      800 (Trig_Dead_Catch_Func003Func001Func002A, 17992), 1600 (Trig_Dead_Catch_Func003Func001Func001Func002A, 17964),
      3200 (Trig_Dead_Catch_Func003Func001Func001Func001Func002A, 17936),
      6400 (Trig_Dead_Catch_Func003Func001Func001Func001Func001Func002A, 17908).
      Each living enemy within the group radius of the target point takes it once. That radius in
      Trig_Dead_Catch_Actions (lines 18036-18052: 250, 300, 350, 400, 500) equals the object data area used for
      radius; range is object data. Not mapped: each hit also creates a dummy unit (h00J, timed life 3 s) ordered
      to attack the caster. Mapped as healPerHit: Trig_Catch_Actions heals the caster by 50, 100, 150, 200, 300
      per level when it attacks (lines 18113-18125); the heal is wired in. AI_Setup (33067-33069) only stores AI hints.

