- id: wailing-wave
  source: A00Z
  name: { en: Wailing Wave, cs: Kvílivá vlna }
  description: { en: "A wail that wounds and slows everything around you.", cs: "Kvílení, které zraní a zpomalí vše kolem tebe." }
  kind: nova
  targeting: around_self
  params:
    # Tuned in phase 2b-2, task 6 (docs/DECISIONS.md): the script values 1000 and 5000 (see review) x 0.93.
    damage: { design: [933, 4660] }
    radius: area
    slow: DataC
    slowSeconds: duration
  review:
    jassFunctions:
      - Trig_Ghost_Angry_Actions
    notes: >-
      Trig_Ghost_Angry_Actions (war3map.j v20.75, lines 17149-17155) sets the damage to 100 x hero level at
      ability level 1 and 250 x hero level at level 2 (Trig_Ghost_Angry_Func003C, 17046, tells the levels apart),
      and deals it in 15 growing rings of 12 circles (radius 250) around the caster. The game has no damage per
      hero level, so damage is a design value: the script's amount at the hero level that unlocks each ability
      level in the map (10 and 20): 1000 and 5000. The plan's stand-in values (3000, 8000) were not needed.
      radius, slow and slowSeconds are object data.

