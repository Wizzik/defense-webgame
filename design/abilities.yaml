# Serpent Shaman

- id: serpent-totem
  source: A062
  name: { en: Serpent Totem, cs: Hadí totem }
  description: { en: "Raises snake totems that bite nearby enemies.", cs: "Postaví hadí totemy, které koušou nepřátele v okolí." }
  kind: summon
  targeting: densest_cluster
  # The map's cooldown is 5, 7, 9, 12, 15. Petr set one slow cast for every level on 2026-11-12, the same
  # as Wisp Ward: with the small cap below, each cast moves half of the totems to the fight.
  cooldown: { design: [15, 15, 15, 15, 15] }
  params:
    # The map's DataA is 1, 2, 3, 4, 5. Petr's values of 2026-11-12, shared with Wisp Ward.
    # 2 totems from level 1 since 2026-11-26: with every enemy going for a hero near the castle the shaman could not
    # hold the first waves (autopilot: 7 of 8 died before level 5).
    count: { design: [2, 2, 2, 3, 3] }
    # Petr 2026-11-27 (after batch 3): a totem lives 15 s (the map's 60); a sentry ward 10 s.
    duration: { design: [15, 15, 15, 15, 15] }
    range: range
    # The map's totem attacks for 101, finds a target within 600 and has an attack interval of 1.0 s,
    # which is multiplied by heroes.attackCooldown 0.5. The cap on living totems is our own.
    # The map's ward attacks for 101; Petr halved it on 2026-11-11 (the Serpent Shaman won every run).
    # 60 since 2026-11-12: with the cap of 2-6 totems and the slow cast, 50 won 1 of 5 test seeds and 75 won 15 of 15.
    # Petr 2026-11-26: the wards were weak late; every level x1.5 (20, 30, 45, 68, 101 in the game).
    # Petr 2026-11-27 (batch 2): "100 dmg + 25 % každý level": 100, 125, 150 ... 325 over the 10 levels in the game
    # (linear, +25 % of level 1 a level; times spell power). These design values give that row after
    # abilities.damage (x0.3), levelGrowthExponent (0.5) and the spread to 10 levels. Batch 3 (6 levels, the ends
    # kept): 100, 145, 190, 235, 280, 325.
    damage: { design: [333, 810, 1510, 2410, 3520] }
    attackRange: { design: [600, 600, 600, 600, 600] }
    attackInterval: { design: [0.5, 0.5, 0.5, 0.5, 0.5] }
    # Petr's values of 2026-11-12 (was 3, 6, 9, 12, 15), shared with Wisp Ward; x5 in Petr's batch 3 (2026-11-27:
    # "počet ward maximum ... na 5x tolik"), the count per cast stays.
    maxAlive: { design: [20, 20, 20, 30, 30] }

