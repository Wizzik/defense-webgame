# Gravecaller

- id: grave-grasp
  source: A02H
  name: { en: Grave Grasp, cs: Hrobový stisk }
  kind: area
  targeting: densest_cluster
  params:
    radius: area
    range: range
    damage: { design: [0, 0, 0, 0, 0] }
  review:
    notes: >-
      damage is 0 because no listed function holds a damage value (the object data field is a placeholder 1).
      Trig_Dead_Catch_Conditions only checks that the cast ability is A02H.
      Trig_Dead_Catch_Func003C and its Func001...C variants, and Trig_Catch_Func004C and its Func001...C variants,
      only check the A02H level (1 to 5).
      AI_Setup only stores AI hints for A02H in udg_AIHT (slot 0 of hero O00F; an order id, 9 and 800).
      The per-level damage is dealt in group callbacks of the same trigger (Trig_Dead_Catch_Func003Func002A and its
      Func001 variants), which are not in jassFunctions. radius and range come from the object data (area, range).

