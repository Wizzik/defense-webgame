# Items (gear). The order is the item index in the game: add new items at the end of their rarity block only
# before a release that may drop saved loadouts by index; saved data uses ids, so the order is free otherwise.
# slotType: one of the 14 types (a ring fits ring1 and ring2, a trinket trinket1 and trinket2).
# rarity: common (1 stat row), rare (2), epic (3), legendary (4), mythic (5).
# stats: values at item level 1. damage, attackSpeed, moveSpeed, spellPower and goldFind are shares (0.05 = 5 %).
#   Budget per item at level 1, summed over the rows: common 6, rare 12, epic 20, legendary 30, mythic 42 points;
#   1 point = 1 attribute = 12 hp = 0.25 armor = 0.1 regen = 1 % = 10 magnet.
# source: optional, the map's item category that inspired the item (traceability only, never written to data/generated).
# Names are our own; nothing is copied from the map.

# Common: one per slot type. A chest puts these into an empty slot for the run.
