# Items (gear). The order is the item index in the game: add new items at the end of their rarity block only
# before a release that may drop saved loadouts by index; saved data uses ids, so the order is free otherwise.
# slotType: one of the 14 types (a ring fits ring1 and ring2, a trinket trinket1 and trinket2).
# rarity: legendary (4 stat rows) or mythic (5). Named items have no lower rarity (Petr, 2026-11-28: the former common
#   and rare items are legendary, the epics mythic but in trinket, mainHand and offHand, which became legendary);
#   common to epic drops and chest cards are random items (design/item-bases.yaml). The rows below the item budgets
#   for common to epic still price random items (budget below).
# stats: values at item level 1. damage, attackSpeed, moveSpeed, spellPower, goldFind, magicFind and lifesteal are shares
#   (0.05 = 5 %).
#   Budget per item at level 1, summed over the rows: common 6, rare 12, epic 20, legendary 30, mythic 42 points;
#   1 point = 0.5 attribute = 0.5 % damage, attack speed or spell power = 12 hp = 0.25 armor = 0.1 regen
#   = 1 % move speed or gold = 10 magnet = 2 % magic find = 0.25 % lifesteal (tuned in docs/DECISIONS.md, sections Gear,
#   drops and chests and Sustain). Lifesteal replaced one row of the same points on ten items (spec 2026-11-19 sustain).
#   The stats random items brought (crit chance and damage, dodge, damage taken, thorns, cooldown speed, ultimate
#   cooldown, area size) are priced in design/affixes.yaml (`unit`); a named item may use them at those prices.
# effect: every named item has one (sim/gear-effects.ts, 11 kinds; one kind does not stack, the later slot counts).
#   A mythic has the stronger version of its kind (about 1.5 x the legendary's, or a shorter cooldown). effect.params
#   are fixed: an effect does not grow with the item level. effect.text is the tooltip line and must say the same numbers.
#   New items of 2026-11-28 keep their old rows first, every row the same share of the budget (whole points), and add
#   rows of their theme (scratchpad script of that day; docs/DECISIONS.md, Named items only legendary / mythic).
# source: optional, the map's item category that inspired the item (traceability only, never written to data/generated).
# Names are our own; nothing is copied from the map.

# Legendary: four stat rows, 30 points, and a special effect (sim/gear-effects.ts).
- id: travelers-hood
  name: { en: "Traveler's Hood", cs: "Poutníkova kápě" }
  slotType: head
  rarity: legendary
  stats: [{ stat: int, value: 4 }, { stat: spellPower, value: 0.04 }, { stat: hp, value: 84 }, { stat: cooldownSpeed, value: 0.035 }]
  effect:
    kind: haste_on_elite_kill
    params: { cooldownSpeed: 1.5, seconds: 8 }
    text:
