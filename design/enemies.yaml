# Enemies of the human wave (phase 2b-1).
# The order is the type index in the game: keep shieldbearer first and add new types at the end.
# source: unit code in the map export (units.json).
# mapName: the unit's name in the map, kept here only to look it up.
#   data-build never writes it to data/generated.
# multipliers: a variant of the map unit (runner, elite). They multiply the map's numbers
#   (hp, damage, moveSpeed, collision) before design/scaling.yaml applies.
#   The damage multipliers are the balance of phase 2b-2 (docs/DECISIONS.md): melee types deal about half
#   of the map's damage and shooters a third, because packs now reach the hero and the castle from every side.
# behavior: how the type walks (design value): siege, flank, skirmish, support or charge.
# xp: crystal value (design value).
# charge: design value. The lancer stops, then runs at the hero in a straight line (sim/enemy-charge.ts).
# aura: design value. Enemies near the captain walk and hit harder (sim/enemy-aura.ts).
# heal: design value. The map's Priest uses the default WC3 Heal (25 hp for mana);
#   8 = 25 x 0.3, the same factor scaling.yaml gives enemy hp.
# boss: a boss of phase 2b-3: a variant of a map unit with its own name. The hp multiplier is the target hp
#   (12 000, 20 000, 30 000 and 257 000 for the final boss, tuned up from 60 000 so the last fight takes 40-90 s)
#   divided by the generated hp of the source.
# model: id of the enemy type whose model the type is drawn with.
# strike: design value (sim/enemy-strike.ts): a warning circle on the hero from afar; with `leap` the boss jumps into it.
# hunter: design value: the type goes for the hero whatever the role of its pack is.
# slam: design value (sim/enemy-slam.ts). The cooldown range is the map's Thunder Clap of the final golems (7-15 s).

- id: shieldbearer
  source: hfoo
  mapName: Footman
  name: { en: Shieldbearer, cs: Štítonoš }
  multipliers: { damage: 0.5 }
  behavior: siege
  xp: 1

- id: scout
  source: hfoo
  mapName: Footman
  name: { en: Scout, cs: Zvěd }
  multipliers: { hp: 0.5, moveSpeed: 1.5, collision: 0.8, damage: 0.3 }
  behavior: flank
  xp: 1

- id: musketeer
  source: hrif
  mapName: Rifleman
  name: { en: Musketeer, cs: Mušketýr }
  # shooters stand off and fire at the hero and the castle all the time: at full damage they dealt most of it
  multipliers: { damage: 0.32 }
  behavior: skirmish
  xp: 2

- id: chaplain
  source: hmpr
  mapName: Priest
  name: { en: Chaplain, cs: Kaplan }
  # a healer first: its 600-range attack at full damage outranged and wore down every hero but one
  multipliers: { damage: 0.65 }
  behavior: support
  xp: 2
  heal: { amount: 8, range: 450, cooldown: 1 }

- id: lancer
  source: hkni
  mapName: Knight
  name: { en: Lancer, cs: Kopiník }
  multipliers: { damage: 0.5 }
  behavior: charge
  xp: 4
  charge: { minRange: 300, maxRange: 700, windupSeconds: 0.5, speedMultiplier: 2.5, damageMultiplier: 1.5, distance: 900, cooldownSeconds: 6 }

- id: captain
  source: hkni
  mapName: Knight
  name: { en: Captain, cs: Kapitán }
  # elite-boss-threat (2026-11-12): the elite hunts the hero and charges (hp 3 -> 5, moveSpeed 0.8 -> 1.0: a little slower
  # than a hero on foot, the charge closes the gap). hp 6, damage 1 and moveSpeed 1.1 left the autopilot 1-3 wins of 20.
  multipliers: { hp: 5, damage: 0.75, collision: 1.5, moveSpeed: 1.0 }
  behavior: charge
  hunter: true
  xp: 12
  charge: { minRange: 300, maxRange: 700, windupSeconds: 0.5, speedMultiplier: 2.5, damageMultiplier: 1.5, distance: 900, cooldownSeconds: 6 }
  aura: { radius: 400, moveSpeed: 0.25, damage: 0.25 }

- id: iron-marshal
  source: hkni
  mapName: Knight
  name: { en: Iron Marshal, cs: Železný maršál }
  multipliers: { hp: 18.7, collision: 2.5, damage: 1.0 }
  behavior: charge
  xp: 150
  charge: { minRange: 300, maxRange: 700, windupSeconds: 0.5, speedMultiplier: 2.5, damageMultiplier: 1.5, distance: 900, cooldownSeconds: 6 }
  boss: true
  model: lancer
  slam: { radius: 350, damage: 120, windupSeconds: 1, cooldownSeconds: [7, 15] }
  strike: { minRange: 450, maxRange: 1300, radius: 260, damage: 150, windupSeconds: 1, cooldownSeconds: 6, leap: true }

- id: pale-abbot
  source: hmpr
  mapName: Priest
  name: { en: Pale Abbot, cs: Bledý opat }
  multipliers: { hp: 153.8, collision: 5, damage: 0.65 }
  behavior: siege
  xp: 300
  heal: { amount: 40, range: 600, cooldown: 1 }
  boss: true
  model: chaplain
  slam: { radius: 400, damage: 180, windupSeconds: 1, cooldownSeconds: [7, 15] }
  strike: { minRange: 450, maxRange: 1300, radius: 280, damage: 220, windupSeconds: 1, cooldownSeconds: 6, leap: true }

- id: gunmaster
  source: hrif
  mapName: Rifleman
  name: { en: Gunmaster, cs: Mistr střelby }
  multipliers: { hp: 160.4, collision: 2.5, damage: 0.6, range: 1.75 }
  behavior: skirmish
  xp: 450
  boss: true
  model: musketeer
  slam: { radius: 400, damage: 240, windupSeconds: 1, cooldownSeconds: [7, 15] }
  # the shooter stays where it is: the shot lands where the hero stood
  strike: { minRange: 450, maxRange: 1500, radius: 240, damage: 260, windupSeconds: 1, cooldownSeconds: 4, leap: false }

- id: dread-regent
  source: hkni
  mapName: Knight
  name: { en: Dread Regent, cs: Hrůzný regent }
  multipliers: { hp: 400, collision: 3, damage: 1.5, moveSpeed: 0.8 }
  behavior: charge
  xp: 1
  charge: { minRange: 300, maxRange: 700, windupSeconds: 0.5, speedMultiplier: 2.5, damageMultiplier: 1.5, distance: 900, cooldownSeconds: 6 }
  aura: { radius: 400, moveSpeed: 0.25, damage: 0.25 }
  boss: true
  model: captain
  slam: { radius: 500, damage: 350, windupSeconds: 1, cooldownSeconds: [7, 15] }
  strike: { minRange: 450, maxRange: 1300, radius: 300, damage: 400, windupSeconds: 1, cooldownSeconds: 5, leap: true }
