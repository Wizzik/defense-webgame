# Affixes of random items (spec 2026-11-26 random items, sections 2-5; docs/DECISIONS.md, section Random items).
# One affix per stat; an item names a stat at most once. The numbers of a roll live in rules.loot (design/rules.yaml).
# tags: the role pools that hold the affix. Smart loot draws rules.loot.smartShare of an item's affixes from the
#   pool of the hero's primary attribute, the rest from all affixes. Lifesteal is in every role's pool (Petr
#   2026-11-27: one lifesteal for attacks and spells).
# unit: the value of one budget point at item level 1. The stats of named items keep the prices of the
#   design/items.yaml header; the new stats (stage 2 of the plan teaches the sim to read them) are priced here:
#   1 point = 1 % crit chance (a crit deals +50 % at first, so 1 % = 0.5 % damage), 5 % crit damage, 0.5 % dodge,
#   0.5 % less damage taken, 5 % of a melee hit back as thorns, 0.5 % faster cooldowns, 1 % faster ultimate
#   cooldown, 0.5 % larger spell radius.
# maxTier: the highest tier the affix rolls (missing: 4); defensive shares and lifesteal stop at 3.
# prefix: given by the item's first affix, in front of the base; CS in the four forms of the base's gender
#   (m, f, n, p for a plural noun). suffix: given by the second affix, behind the base ("of the Bear", "medvěda").
# Names are our own; nothing is copied from the map.

# STR (tank)
- { stat: str, tags: [str], unit: 0.5, prefix: { en: "Mighty", cs: { m: "Mocný", f: "Mocná", n: "Mocné", p: "Mocné" } }, suffix: { en: "of the Bear", cs: "medvěda" } }
