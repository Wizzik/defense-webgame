# Two-word names of random items with three or more affixes (spec 2026-11-26 random items, section 5):
# a first word and a noun of the item's slot type ("Grim Crown", "Ponurá koruna"). Items with one or two affixes are
# named by their prefix and suffix instead (design/affixes.yaml).
# first: EN, and CS in the four forms of the noun's gender (m, f, n, p for a plural noun).
# nouns: per slot type; gender of the CS word.
# Names are our own; nothing is copied from the map.
first:
  - { en: "Grim", cs: { m: "Ponurý", f: "Ponurá", n: "Ponuré", p: "Ponuré" } }
