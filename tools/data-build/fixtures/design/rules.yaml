  berserk: { damage: 1.5 }
  heal: { share: 1 }
magicFind: { limit: 1.5, rarityFactor: { rare: 1, epic: 1.5, legendary: 2, mythic: 2.5 } }
gear: { levelStep: 0.15, chestLevelStep: 0.3, maxPermanentLevel: 5 }
