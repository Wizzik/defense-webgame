factions:
  - { id: human, name: { en: Legion, cs: Legie }, fromPhase: 1, elite: grunt, heavy: grunt }
events:
  - { atSeconds: 30, kind: rush, elites: 1, heavies: 2 }
  - { atSeconds: 60, kind: boss, enemy: warlord }
