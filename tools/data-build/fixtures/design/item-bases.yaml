# Item bases of random items (spec 2026-11-26 random items, section 2; docs/DECISIONS.md, section Random items).
# A rolled item = base + rarity + affix rows (design/affixes.yaml, rules.loot in design/rules.yaml).
# slotType: one of the 14 types. flavour: heavy str, light agi, cloth int, or neutral any; smart loot prefers the
#   base of the hero's primary attribute (rules.loot.smartShare). Every slot type has a str, an agi and an int base.
# implicit: the base's own row, worth rules.loot.implicitPoints (2) points at item level 1, priced by the affix units:
#   1 attribute, 24 hp, 0.5 armor, 0.2 regen, 1 % damage, attack speed or spell power, 2 % move speed or gold,
#   20 magnet, 4 % magic find. Only stats the sim reads today.
# gender: of the Czech noun, for the prefix adjective in front of it: m, f, n, or p for a plural noun (boty).
#   The CS name starts with a capital; behind a prefix it is lowercased ("Mocná železná přilba medvěda").
# icon: the game-icons.net icon (stage 6 of the plan), missing until then.
# Names are our own; nothing is copied from the map.

